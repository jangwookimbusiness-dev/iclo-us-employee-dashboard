decided:
  - id: REBUILD-FRAMEWORK
    on: 2026-08-26
    by: J. Kim (merge decision; Codex recommendation and spike)
    marker: 프론트엔드 프레임워크를 넣지 않는다
    what: |
      Python 3.14 와 이미 고정된 PyYAML 로 vanilla HTML·CSS·JavaScript 와
      canon.json 을 같은 출력 디렉터리에 빌드한다. canon.json 은 탭·제목·KPI 라벨·
      최소 셀·색상·enum 같은 정적 화면 계약을 갖고, PROJECT_PHASE=demo 동안에는
      현재 합성 시나리오·KPI 값·신선도도 정본에서 가져온다. A3/A2 로 전환하면
      측정값·신선도는 기업별 export JSON 이 유일한 출처가 되고 synthetic 고지는
      그 export 의 envelope 필드가 결정한다. 빌더는 정본 경로와 출력 디렉터리를
      인자로 받아 test_single_source 가 임시로 변조한 정본을 같은 빌드 경계에 넣을
      수 있어야 한다. 생성물은 추적하거나 손으로 고치지 않는다.
    where: REBUILD-CHARTER.md §4.2
    evidence: |
      이슈 #36 의 재실행 가능한 스파이크. 변조된 activated 0.44 를 빌더가 무시했을
      때 새 값 부재와 옛 값 잔존을 함께 검출했고, 같은 빌더가 임시 정본을 읽도록
      하자 통과했다.
    tracking: |
      root AGENTS.md 와 REBUILD-CHARTER.md 가 열린 질문을 가리켰다. 저장소 구현 결정은
      제품·규제 awaiting_decision 목록이 아니라 type:decision 이슈 #36 에서 추적했다.
    still_open: |
      #38·#39·#43·#44 로 demo 의 변조→빌드→렌더 경계가 섰다. 정본에서 오는 값이 두 갈래다:
      fetch 값(계약 키 12개)은 canon.json 으로, 치환 값(6개)은 빌드 시점에 템플릿으로. 갈라진
      이유는 fetch 가 닿지 못하는 자리 — CSS 커스텀 프로퍼티와 head 의 title — 뿐이다. 두 갈래
      다 범위를 스스로 강제한다: 스테이징한 키나 템플릿의 치환 자리에 변조 케이스가 없으면
      검사가 실패한다. check_dashboard 의 새 화면 몫(상수·라벨·색상·산문 규칙)은
      test_build_reads_canon 으로 옮겼다.
      남은 것: 헌 화면(index.html·app.html)이 있는 동안 test_single_source 와 check_dashboard
      가 그 문지기로 남고, 소멸 조건은 검사 설계가 아니라 헌 화면을 지우는 결정이다.
      Signals·Funnel 탭이 없어 valid·gap·closed·signals 는 읽는 사람이 없다. 치환 값은
      스타일시트가 선언한 값까지 보고 계산된 색은 안 본다. A3/A2 측정값의 export 변조→렌더
      경계는 #8~#10 에서 PROJECT_PHASE 전환과 함께 필수화한다.
    rejected: |
      Vite·React 재도입과 새 템플릿 의존성은 두 판단 기준에 필요한 기능을 더하지
      않는다. 런타임 원시 YAML 읽기는 빌드 시점 정본 읽기가 아니다.

