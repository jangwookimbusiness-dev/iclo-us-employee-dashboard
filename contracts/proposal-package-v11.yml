# ICLO × Snowflake 제안 패키지 — 정본 (canonical contract)
#
# 이 파일이 하나의 정본이다. 대시보드 코드·기술문서·Report·Proposal·PRD가
# 서로 다른 말을 하기 시작한 것이 2026-08-09 정합성 감사의 결론이었고,
# 그 원인은 정본이 셋(PRD / 기술문서 / index.html)으로 갈라져 있었던 것이다.
#
# 값을 바꿀 때: 여기를 먼저 바꾸고 → scripts/check-package-consistency.py 를 돌려
# 어느 산출물이 어긋나는지 확인한 뒤 → 그 산출물을 고친다. 역순으로 하지 않는다.
#
# 검사기: scripts/check-package-consistency.py
# 감사 근거: 2026-08-09 sync audit (Claude + codex)

meta:
  package: proposal-v10
  updated: 2026-08-09
  owner: Jangwoo Kim

# ─────────────────────────────────────────────────────────────
# 산출물 — 무엇이 정본이고 무엇이 파생인가
# ─────────────────────────────────────────────────────────────
artifacts:
  dashboard:
    path: index.html
    kind: 배포된 데모
    spec: employer-dashboard-poc/docs/PRD.md
    note: 코드는 루트, 스펙은 옆 폴더. index.html 에서 PRD 를 가리키는 것이 없으므로 반드시 함께 연다.
  tech:
    path: output/proposal-v10/06_Tech/ICLO-Evidence-Layer-DB-설계-KO.md
    kind: 기술 주장의 정본
    builder: scratchpad tech/build.py
  diagram:
    kind: 파생 (기술문서 기준). 2026-08-09 에 한 장을 세 장으로 나눔.
    why_split: |
      2000px 한 장짜리는 실제 배포되는 두 곳에서 판독 한계 아래였다 —
      기술문서 PDF(A4 가로) 본문 중앙값 4.4pt, 1-pager 슬라이드 5.0px.
      글자 크기가 아니라 축소 배율(0.39~0.48×) 문제라 캔버스를 줄여야 했다.
      rendered_pt = font_px × (page_inch × 72) / viewbox_width
    sheets:
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-A-원천과정본.svg      # 1240×900
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-B-통제와노출.svg      # 1240×880
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-C-경계와미결.svg      # 1240×664
    slide_variant:
      path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-슬라이드-전체.svg   # 1180×642 — 제목은 슬라이드 헤더가 갖는다
      what: 1-pager 는 전체 흐름을 한 장에 본다 — 세 장 분할은 기술문서에만 적용.
      how: 골격(3구역 · ①~⑦)은 그대로 두고 세부 설명줄을 뺀 개요판. 슬롯 9.50in 에서 7.5pt.
    generator: scratchpad svg/gen.py — 상자 넘침과 텍스트 겹침을 생성 시 검사한다
    min_pt: A4 가로에서 최소 7.1pt (이전 3.9pt)
  report_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Report-v10-KO-Internal.docx
    kind: 내부 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  INTERNAL REVIEW"
  report_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Report-v10-EN-External.docx
    kind: 대외 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  JOINT VALIDATION REPORT"   # Proposal 과 같은 머리글을 쓰면 안 된다
  proposal_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Proposal-v10-KO-Internal.pptx
    kind: 내부 덱
    builder: tmp/iclo-snowflake-proposal-v10/build_decks_v10.mjs
  proposal_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Proposal-v10-EN-External-Notes-Stripped.pptx
    kind: 대외 덱 — 실제로 나가는 문서
    builder: tmp/iclo-snowflake-proposal-v10/build_decks_v10.mjs

# ─────────────────────────────────────────────────────────────
# 대시보드 화면 — 코드에 있는 문자열이 정본이다
# 문서가 대시보드를 설명할 때 이 이름을 그대로 써야 대응이 된다
# ─────────────────────────────────────────────────────────────
dashboard:
  title: ICLO HomeDen Employer Analytics
  tabs:                     # index.html TABS 상수와 1:1
    - key: overview
      label: Overview
      heading: Program overview
    - key: signals
      label: Signals
      heading: Oral-health signal distribution
    - key: funnel
      label: Funnel
      heading: Intervention funnel
  views_deferred:
    - name: Preventive-visit Trend vs Control
      reason: 실험군 배정에 동의 근거·배정 규칙·프로토콜 책임자가 없다
      returns_when: 법무·프로토콜 승인 후
      note: PRD 원안의 4번째 뷰. 의도적 보류이며 미구현이 아니다.

  kpis:                     # 화면 라벨 = 정본. 문서는 이 문자열을 쓴다.
    - label: Eligible employees
      const: null
      definition_ko: 기준 시점에 플랜 자격이 있는 임직원 수
      source: HRIS · 834 eligibility
    - label: Activated (registered + first questionnaire)
      const: FRAC.activated
      value: 0.38
      definition_ko: 가입 + 첫 문진 완료 / 자격자
      source: App · consent + events
    - label: People with a valid capture
      const: FRAC.valid
      value: 0.28
      # 2026-08-16: 라벨이 "Valid capture (passed photo-quality gate)" 였다. 그러면
      # 촬영을 세는 것으로 읽히고, 아래 metric_time_contracts.signal_distribution 이
      # 정한 사람 단위와 어긋난다. 퍼널의 앞뒤 단계가 전부 사람인데 이 단계만 촬영이면
      # 겹치지 않는다 — funnel_nesting 이 금지하는 상태다.
      definition_ko: 품질 게이트를 통과한 촬영을 그 창 안에 1건 이상 만든 사람
      source: App · photo-derived signals (versioned)
      gap: 기술문서 §3 화면 지표표에 이 항목이 없다 — 추가해야 한다
    - label: Open care actions
      const: FRAC.gap
      value: 0.095
      definition_ko: 발생한 조치
      source: App events + TPA claims-confirmed
    - label: Completed actions
      const: FRAC.closed
      value: 0.042
      definition_ko: 청구로 확인된 완료 (confidence HIGH 만)
      source: App events + TPA claims-confirmed

  repeat_participation:
    const: FRAC.repeat
    value: 0.61
    definition_ko: 2회 이상 유효 촬영한 사람 / 활성 사용자

  # ───────────────────────────────────────────────────────────
  # 지표 시간 계약 — 2026-08-14 확정 (엔지니어링 리뷰 T14)
  #
  # 위 kpis 의 정의는 전부 시간이 없는 비율이었다. 기술문서 §1.1 이
  # "사람·기간별 유효 참여 정의, 품질 통과 조건, 중복 제거, 속도 제한이
  # 필요합니다" 라고 적어둔 그 빈 곳이며, 이것 없이는 MART SQL 을 쓸 수
  # 없다. 아래가 그 계약이다.
  # ───────────────────────────────────────────────────────────
  metric_time_contracts:
    report_period: 보고월(report month). 모든 지표가 같은 보고월을 쓴다. 섞으면 퍼널이 겹치지 않는다.

    valid_capture:            # 모든 촬영 기반 지표가 이 정의를 공유한다
      quality: oral_signal.quality_passed = TRUE 인 것만
      dedup: 사람·날짜당 1건. 기술문서 §4.6 의 24시간 규칙을 다보호자 가구 밖으로 확장한다
      rate_limit: 사람·월당 최대 4건까지만 집계에 반영
      idempotency: oral_signal.request_id
      why: |
        기술문서 §1.1 — 보상이 걸리면 같은 날 가족 프로필을 번갈아 저품질 사진을
        수십 번 올릴 수 있고, 그대로 세면 반복 클릭이 기업 성과로 보고된다.

    activated:
      numerator: 보고월 자격자 중 REGISTERED 와 QUESTIONNAIRE 를 보고월 말까지 모두 완료한 사람 (누적)
      denominator: 보고월 자격자
      window: 분자는 누적, 분모는 보고월 시점
      why: |
        분자를 전체 기간 누적으로 두고 분모를 현재 자격자로 두면 100% 를 넘지 않는다.
        반대로 분자에 이미 퇴사한 사람을 넣으면 비율이 계속 오르기만 하고 100% 를 넘는다.

    repeat_participation:
      numerator: 직전 12개월에 유효 촬영이 2회 이상인 사람
      denominator: 같은 12개월에 유효 촬영이 1회 이상인 사람
      window: 롤링 12개월
      why: |
        누적으로 정의하면 시간이 갈수록 100% 로 수렴한다 — 3년 된 코호트는 언젠가
        2회를 채운다. 그러면 지표가 신호이기를 그만둔다. 롤링 창이어야 한다.

    signal_distribution:
      unit: 촬영이 아니라 **사람**. 사람당 그 창의 최신 유효 촬영 1건만 센다
      window: 롤링 12개월
      model_version: |
        창 안에 model_version 이 둘 이상이면 분포를 버전별로 나누거나 혼합 비율을
        명시한다. 같은 사진이 버전에 따라 다른 밴드가 될 수 있다 (기술문서 §5.3).
      why: |
        촬영 단위로 세면 한 사람이 50번 찍어 분포를 흔든다 — §1.1 의 게임 벡터가
        여기서 실현된다. "우리 임직원의 구강 신호 구성" 은 사람 단위 개념이다.

    open_care_actions:
      definition: 보고일 기준 closed_at IS NULL 이고 opened_at + window_days 가 아직 지나지 않은 조치
      note: 창이 지난 조치는 EXPIRED 로 닫혀야 하며 open 이 아니다

    completed_actions:
      numerator: close_reason = 'CLAIM_CONFIRMED' 이고 action_claim_match.confidence = 'HIGH'
      denominator: |
        **성숙한 코호트만.** opened_at + window_days + 청구지연 P90 이 보고일 이전인 조치.
        미성숙 코호트는 분모에서 빼고 화면에 "집계 중" 으로 따로 표시한다.
      why: |
        청구 지연이 중앙값 45일·롱테일 180일이다 (기술문서 §6.3). 최근에 연 조치는
        완료할 시간 자체가 없었으므로 그대로 세면 완료율이 낮게 나오고 나중에 저절로
        오른다. PMPM run-out 과 같은 함정이며, 좋아지는 방향이라 오류가 성과로 보인다.

    funnel_nesting: |
      Activated → Valid capture → Open action → Completed 는 같은 보고월과 같은 자격자
      분모를 써야 겹친다. 하나라도 다른 창을 쓰면 뒤 단계가 앞 단계보다 커질 수 있다.

    open_questions:           # 이 계약이 못 정한 것. 정하는 사람은 J. Kim.
      - 동의 철회자의 소급 처리 — 기술문서 §5.4 가 "이미 배포된 보고서와 이미 생성된
        추론 결과를 재작성하는지"를 미정으로 남겼다. 재작성하면 과거 보고서가 바뀌고,
        안 하면 철회가 집계에 안 걸린다. 지표 정의가 아니라 정책 결정이다
      - 청구지연 P90 의 값 — 파일럿 첫 6개월은 실측 전이라 합성 분포를 쓴다.
        실데이터에서 확정 전까지 completed_actions 는 "잠정" 으로 표시한다

  signals:                  # PRD §4b 5항과 index.html SIGNALS 가 일치해야 한다
    - {key: Low,      share: 52}
    - {key: Moderate, share: 33}
    - {key: Priority, share: 15}

  scenarios:                # PRD §2, index.html SCEN, 기술문서 §14.4 세 곳 일치
    - {key: A, employees: 10000, pmpm: 31.4, label: baseline}
    - {key: B, employees: 2500,  pmpm: 32.8, label: small}
    - {key: C, employees: 25000, pmpm: 30.9, label: large}

  constants:
    min_cell: 20            # 기업 화면 최소 셀. 기술문서 가정 A8, PRD 레드라인
    dep_ratio: 2.2          # 자격자당 가입 인원. 기술문서 "member_month 약 22,000행" 과 정합
    lag_days: 60            # 데모 표시값. 실제는 분포(중앙값 45·롱테일 180) — 기술문서 §6.3
    completeness_pct: 98.4  # 합성 데모 값. 실데이터에서는 지연 곡선 출처를 밝혀야 한다
    eligibility_thru: "2026-07"
    claims_thru: "2026-05"

  # 부스 라이브 캡처 — 2026-08-12 결정 (J. Kim) 으로 폐기.
  # SWT Seoul 부스는 A/B/C 합성 시나리오만 띄운다. 방문자 촬영·명찰 QR·연락처 수집·
  # 부스 employer(LIVE) 를 전부 걷어냈고 index.html 과 capture.html 에서도 지웠다.
  # PRD §2.5 의 "Seoul-only · 폐기" 열이 그대로 실행된 것이며, "survives" 열은 남는다.
  #
  # 여기서 같이 사라진 것: PIPA §23 민감정보 처리, 부스 동의문, 명찰 HMAC,
  # 5건 배치 갱신 가드, "U.S. GTM sample" 탭 이름, 촬영 앱.
  # 미국 PoC 에서는 기업·TPA·임직원 앱 실데이터로 대시보드를 채운다. 그 설계는
  # 기술문서와 start_gates 가 계속 관장한다.

  colors:                   # PRD §3·§5.6 레드라인
    coral: "#C2333A"        # 원안 #FF7A79 는 흰 배경에서 2.53:1 로 WCAG AA 미달이었다.
                            # 2026-08-08 design review 에서 5.49:1 로 교체. PRD 갱신 완료.
    coral_dark_mode: "#FF8E8D"
    bars:                   # WCAG 1.4.11 — 의미를 싣는 비텍스트는 3:1. 서열은 휘도로 유지.
      light: {Low: "#7E90AE", Moderate: "#4E8F98", Priority: "#C2333A"}   # 3.05 / 3.46 / 5.16
      dark:  {Low: "#5B7099", Moderate: "#4FA0A9", Priority: "#FF8E8D"}   # 3.51 / 5.77 / 7.91
      was: 원래 #D9E1EE / #8FB8BE 는 1.24 / 2.02 로, 데이터의 53% 를 싣는 Low 가 안 보였다.
    navy: "#1B2A4A"
    teal: "#007A87"
    background: "#FFFFFF"
    rule: 라이트 계열 정의(:root 와 :root[data-theme="light"])는 같은 coral 을 써야 한다

  implementation:
    actual: 단일 vanilla HTML + 인라인 CSS/JS (index.html) 하나. capture.html 은 2026-08-12 삭제
    store: 없음. 브라우저 안 합성 계산만 한다
    inference: 호출하지 않는다. Core AI 호출 계약은 미국 제품 몫으로 기술문서 §8.2 가 관장
    booth: |
      폐기. 두 번의 결정으로 부스가 이 코드에서 완전히 빠졌다.
      2026-08-12 — 라이브 캡처 폐기 (방문자 촬영·배지 스캔·저장소·capture.html)
      2026-08-13 — 부스 데모 자체 폐기. index.html 은 8/27 에 화면에 뜨지 않는다
      따라서 freeze(8/25)·리허설(8/26)·오프라인 번들·iPad 인수 경로가 모두 무효다.
      ICLO 는 덱·백월·영상으로 참가하며 그것들은 이 저장소 소관이 아니다.
    current_purpose: 제안서 스크린샷 원본, 그리고 미국 근거 레이어(A3)의 출발 아티팩트
    touch: 모든 컨트롤 44px 무조건. hover:none 은 키보드 붙은 태블릿에서 안 걸리므로 입력 방식으로 크기를 정하지 않는다.
    chips: 탭하면 적재 경로가 열린다. title 전용이면 태블릿에서 그 정보가 없는 것과 같다.
    not: Vite + React 18 + TypeScript + Tailwind + Recharts
    note: PRD 원안 스택은 미채택. package.json·src·dist 없음. AGENTS.md 의 npm 명령은 실행 불가.

# ─────────────────────────────────────────────────────────────
# 절대 표현 — 범위를 좁히지 않으면 사실과 다른 주장이 된다
# ─────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────
# employer_id 의 세 종류 (2026-08-16 확정)
#
# oral_signal.employer_id 는 NOT NULL 이다. 기업 맥락 없이는 신호를 저장할 수
# 없다는 뜻이고, 그래서 계약된 기업이 생기기 전에 Core AI 왕복을 실제로 돌려
# 보려면 예약된 id 가 필요하다. QA 도 같은 것을 요구한다.
# ─────────────────────────────────────────────────────────────
employer_id_classes:
  real:
    what: 계약된 기업. id 는 계약이 정한다
  demo:
    what: "A · B · C — 합성 시나리오"
    shown: 예. 의도적으로 보여준다. 항상 합성 라벨과 함께
    note: 이미 존재하던 관행이다. 규칙이 없었을 뿐
  internal_test:
    what: 예약 접두사 `_TEST_` (예 `_TEST_CORE_AI`)
    shown: "**아니오. 어디에도.** 화면·내보내기·제안서·스크린샷 전부"
    why_the_policy_is_not_enough: |
      행 접근 정책은 가시성만 막는다 — 대응 롤이 없으면 기업 롤은 그 행을 못
      본다. 그런데 R_ENGINEER 와 R_ANALYST 는 정책을 우회하므로, **내부 분석이
      테스트 인원을 실제 숫자에 섞는 것은 정책이 막지 못한다.** 그것이 이
      접두사가 존재하는 이유다.
    rule: 내부 집계·품질 지표·보고는 `_TEST_` 로 시작하는 employer_id 를 제외한다
    enforced_by: test_export_contract.py — 내보낸 JSON 에 나타나면 실패

# ─────────────────────────────────────────────────────────────
# 내보내기 계약 — A3 가 만들 JSON 의 형태 (2026-08-15 확정)
#
# A3 는 화면 값의 출처를 상수 블록에서 이 파일로 바꾼다. 그 순간 JSON 키가
# 내보내기 쿼리와 렌더러 사이의 계약이 되고, 쿼리에서 이름이 하나 바뀌면
# 화면은 undefined → 빈칸으로 조용히 깨진다. 지금 정해두면 양쪽이 이것을
# 보고 만든다.
# ─────────────────────────────────────────────────────────────
export_contract:
  files: employer-a.json · employer-b.json · employer-c.json + departments.json
  produced_by: 기업별 롤 각각. R_ENGINEER 로 뽑으면 집계 정책이 면제라 억제를 우회한다

  envelope:                 # 모든 파일이 공유. 세 파일에서 값이 같아야 한다
    schema_version: 정수. 렌더러가 모르는 버전이면 숫자를 그리지 말고 멈춘다
    run_id: 한 번의 내보내기 실행. 세 파일이 다르면 회차가 섞인 것이다
    report_snapshot_seq: 어느 스냅샷 기준인가
    exported_at: 내보낸 시각 — **배달 신선도**
    employer_id: 이 파일의 주인
    synthetic: true 인 동안 화면은 합성 라벨을 지운 적이 없어야 한다

  freshness:                # **데이터 신선도**. exported_at 과 다른 것이다
    eligibility_thru: 자격 통용일
    claims_thru: 청구 통용일
    lag_days: 표시용 지연
    completeness_pct: 도착한 허용액 / 예상 최종 허용액
    why: |
      6개월 묵은 청구 위에 방금 내보내기를 하면 exported_at 만 보고는 건강해 보인다.
      index.html:201 의 FRESH 가 이미 원천별로 구분하고 있었고 그 모델을 그대로 옮긴다.

  months:                   # 36개월 전부. 화면은 최신만 쓴다
    grain: employer_id × month_start × department
    fields: [month_start, department, employer_id,
             eligible_employees, covered_members, member_months, dental_pmpm,
             activated, repeat_participation, signal_low, signal_moderate,
             signal_priority, open_actions, completed_actions, completed_cohort_mature]
    suppressed_row: |
      최소 셀 미만 그룹은 값 자리에 null 을 넣고 department 를 null 로 둔다.
      집계 정책의 remainder group 이 그렇게 돌아오기 때문이며, 화면은 그 null 을
      "억제됨" 으로 그린다. 행을 빼면 안 된다 — 빼면 그 부서가 존재하는지도 모른다.

  departments:              # 별도 파일. 억제된 부서도 이름은 남는다
    fields: [department, employer_id]
    why: 셀 억제는 값을 가리는 것이지 부서의 존재를 숨기는 것이 아니다. 필터에 남아야 시연이 된다

  provenance:               # E2. 원천별 구분을 대체하지 말고 덧붙인다
    per_field: 각 지표가 어느 Snowflake 오브젝트에서 나왔는지
    keep: index.html:213 의 원천별 매핑(HRIS·앱·TPA·신호)은 그대로 둔다

# ─────────────────────────────────────────────────────────────
# 두 화면 — 무엇을 누구에게 보이는가 (2026-08-14 확정)
# "밴드만, 점수 금지" 는 기업 뷰의 레드라인이지 앱의 레드라인이 아니었다.
# CEO 리뷰가 이것을 미결로 표시했고 여기서 닫는다.
# ─────────────────────────────────────────────────────────────
surfaces:
  employer_dashboard:
    file: index.html
    shows: 밴드 분포만 (Low·Moderate·Priority). 숫자 점수 금지
    grain: 집계 전용. 최소 셀 20명, 고유 인물 기준
    why: HIPAA 집계 원칙과 기업이 개인을 식별할 수 없어야 한다는 요구
  employee_app:
    file: app.html
    shows: 본인의 밴드 + 방향 문장. **숫자 점수는 안 보인다**
    grain: 본인 데이터만
    # 2026-08-16 정정. 이 파일은 8월 14일까지 "0-100 점수를 보여준다" 고
    # 적고 있었고 app.html 도 그렇게 만들어져 있었다. 사실과 달랐다.
    numeric_score:
      shown_to_member: false
      until: FDA clearance
      why: |
        영상에서 유도한 개인 단위 수치를 본인의 구강 상태로 제시하는 것은
        일반 웰니스 경계 밖으로 읽힌다. 밴드와 방향은 웰니스 쪽에 남는다.
        점수 자체는 내부적으로 계산된다 — 밴드와 변화를 만들려면 필요하다.
        노출만 안 한다.
      when_cleared: 이 항목을 다시 연다. 그때는 규제 판단이지 UI 판단이 아니다
  core_ai_operation:            # 2026-08-16 확정 (J. Kim)
    who: ICLO 직접 운영
    effect: subcontractor BAA 체인 없음. 기술문서 §16-10 닫힘
    but: |
      통제가 면제되는 것이 아니라 ICLO 몫이 된다 — 서비스 자격증명, 추론
      요청·응답 로깅, 보존 기간. 그리고 §16-11 감사 모델이 **쉬워지는 것이
      아니라 가능해진다**: 추론 API 에 공통 요청 ID 를 우리가 심을 수 있다.
      외부 위탁이었다면 벤더 로그에 의존해야 했다.
    change_without_a_number: |
      "지난번보다 나아졌습니다" 처럼 방향만 말한다. 눈금 없는 막대에 위치를
      표시하는 방식은 숫자를 숨긴 숫자이므로 같은 선에 걸린다 — 쓰지 않는다.
    demo_only:
      local_photo: |
        데모는 사진을 페이지 안에 두고 업로드하지 않는다. **제품 성질이 아니라
        데모 성질이다** — §2.1 은 원본을 미국 통제 저장소에 두고 §8.2 가 image_uri
        로 Core AI 를 호출한다. 화면 문구가 "in this demo" 로 한정된 이유이며,
        한정을 빼면 배포된 제품이 첫 촬영에서 깨뜨리는 약속이 된다.
      until: 촬영 동의·보존 일정·삭제 경로가 생길 때까지
    still_forbidden: |
      질환 특정 표현과 임상 판정 문구. 밴드 옆에는 "임상 소견이 아니며
      의학적 조언이 아니다" 가 반드시 함께 간다.
    never: 개인 결과가 기업 뷰로 롤업되지 않는다. 기업은 밴드 분포만 본다

scoped_claims:
  - wrong: "no individual PHI"
    right: "no individual PHI in employer views"
    why: 가입자-월·청구 항목은 개인 단위 레코드 없이 계산할 수 없다. 관리형 처리 레이어에는 개인 레벨 데이터가 존재한다. 통제 대상은 데이터의 존재가 아니라 열람 권한이다. (기술문서 §2.1)
  - wrong: "집계만, 개인정보 없음"
    right: "집계 전용 · 최소 셀은 고유 인물 기준 · 기업 격리"
    why: MIN_GROUP_SIZE 는 기본적으로 행 수를 센다. ENTITY KEY (party_sk) 가 있어야 고유 인물 수로 센다. (기술문서 §10.3)
  - wrong: "실험군 배정 + 청구로 확인한 결과"
    right: "청구로 확인한 결과 (실험군 배정은 법무·프로토콜 승인 후)"
    why: 배정 규칙·동의 근거·프로토콜 책임자가 없다

# ─────────────────────────────────────────────────────────────
# 용어 — 좌변을 쓰면 안 되고 우변을 쓴다
# ─────────────────────────────────────────────────────────────
terminology:
  forbidden:
    - {wrong: "보험자 지급액",  right: "플랜 지급액",  why: self-funded 에서 돈을 내는 주체는 기업이지 보험사가 아니다}
    - {wrong: "보험사가 지급",  right: "플랜이 지급",  why: 같음}
    - {wrong: "HRIS 834",      right: "기업 또는 benefits administrator 가 제공하는 자격 파일, 통상 X12 834", why: 834 를 HRIS 가 직접 뱉는 것이 아니다}
    - {wrong: "Review",        right: "Priority",     why: PRD 레드라인. 신호 라벨}
  disease_words_banned:      # PRD §5.6 · scripts/check-forbidden-terms.sh
    [diagnos, cavit, caries, decay, gingivit, periodont, abscess, lesion]
  pairs:                     # 두 개념을 섞어 쓰지 않는다
    - payer / carrier:  payer 는 비용 부담 주체(self-funded 는 기업), carrier 는 보험 상품 제공자
    - self-funded / ASO / stop-loss:  셋을 세트로 표기한다
    - plan_paid / allowed / member_oop:  합치지 않고 분리해서 저장·표시한다
  ko_en:
    플랜 지급액: plan-paid
    허용액: allowed
    본인부담: member out-of-pocket
    자격 파일: eligibility file
    청구 지연: claims lag
    최소 셀: minimum cell size
    가입자-월: member-month

# ─────────────────────────────────────────────────────────────
# 착수 게이트 — 실데이터 적재 전에 서면으로 닫아야 하는 넷
# 대외 문서(Report EN · Proposal EN)에 반드시 노출한다
# ─────────────────────────────────────────────────────────────
# 실데이터 적재 전에 서면으로 닫아야 하는 것. 아래 넷이 전부가 아니라
# **착수를 막는 부분집합**이다. 법무 게이트 전체 레지스터는 기술문서 §16 이며
# 21개 항목이 있고, 그 절이 스스로 "유일한 법무 게이트 레지스터" 라고 선언한다.
# 2026-08-15 대조 결과 세 문서가 서로 다른 목록을 세고 있었다 — 아래 source 로 고정한다.
start_gates:
  - id: hipaa_roles
    source: 기술문서 §16-1
    ko: HIPAA 역할 규정
    en: HIPAA roles
    what: ICLO·기업·기업 건강플랜·TPA·Snowflake 각각이 covered entity / business associate / subcontractor 중 무엇인가. BAA 체인은 이 판정 위에 세운다.
    if_open: PHI 를 적재할 법적 근거가 없다
  - id: data_rights
    source: 기술문서 §16-2
    ko: 데이터 권리
    en: Data rights
    what: 기업–TPA 계약의 데이터 권리 조항 — 원천별·필드별·목적별로 무엇을 받고 무엇에 쓸 수 있는가
    if_open: 데이터를 받고도 쓸 수 없다. 지연의 대부분이 여기서 생긴다.
  - id: baseline_before_consent
    source: 기술문서 §16-9 (§16 이 유일하게 '착수 차단 항목' 으로 표시한 것)
    ko: 동의 이전 기준선 적재
    en: Baseline load before consent
    what: 기준선 적재가 동의보다 앞선다. 그 시점에 동의한 사람은 없고 파일럿에서 끝내 동의하지 않을 사람이 다수다. 집계 전용 기준선을 택하거나 별도 법적 근거를 서면으로 정한다.
    if_open: 비동의자의 PHI 를 근거 없이 처리하게 된다. 예외가 아니라 구조적 문제다.
  - id: common_identity_key
    source: 기술문서에 게이트로는 없음. 설계는 §4 매칭(party_xref·party_match_exception). 2026-08-15 에 §17 기술 게이트로 추가
    ko: 공통 식별키
    en: Common identity key
    what: 인사 쪽과 TPA 쪽 양쪽에 사람을 연결할 안정적 식별자가 있는가
    if_open: 청구와 앱 이용을 연결할 수 없어 "청구로 확인된 완료" 주장 자체가 성립하지 않는다

# ─────────────────────────────────────────────────────────────
# 현재 상태 — 무엇이 돌아가고 무엇이 없는가
# 대외 문서에 반드시 노출한다. 설계를 운영처럼 쓰지 않는다.
# ─────────────────────────────────────────────────────────────
status:
  running_today:
    - 임직원 대시보드 데모 — 합성 숫자를 브라우저 안에서 계산. 실데이터도 Snowflake 연결도 없음.
  designed:
    - 근거 레이어 데이터 모델, 신원 해석 규칙, 정책·품질 계약, 기업 온보딩 절차, 추론 API 계약
  # 2026-08-12 결정 (J. Kim). 이전 값은 "Snowflake 위의 실데이터 근거 레이어와
  # 실데이터 대시보드" 였고, 그것은 90일 안에 성립하지 않는다. QA-Checklist-v10 80행이
  # 이미 지적했다 — 기업 약정도, 계약된 데이터도, 적재된 청구도, 측정된 결과도 없다.
  # 실데이터를 넣으려면 start_gates 넷이 먼저 서면으로 닫혀야 하고 그건 90일 밖이다.
  # 따라서 90일은 관계와 설계를 검증하는 기간으로 다시 규정한다.
  build_in_90_days:
    items:
      - 미국 HLS GTM·아키텍처 담당자와의 연결, 그리고 검증 상대의 확정
      - 근거 레이어 아키텍처 설계와 Snowflake 보안 기준 정렬
      - start_gates 네 항목의 책임자 지정과 종결 경로 합의
    note: |
      실데이터 적재는 이 90일에 포함되지 않는다. start_gates 넷이 서면으로 닫힌 뒤에 시작한다.
      이 기간이 검증하는 것은 치아 PoC 자체가 아니라 Snowflake 관계와 설계의 성립 여부다.
      제목이나 본문에서 이 90일을 "치아 PoC 검증"으로 부르지 않는다.
  # 데이터 흐름도(06_Tech/ICLO-데이터흐름도-슬라이드-전체.svg)의 "아직 없는 것" 과
  # 항목 단위로 일치시킨다. 그림과 정본이 다르면 회의에서 둘 중 하나가 거짓이 된다.
  does_not_exist:
    items:
      - '임직원 웹앱 — **화면은 2026-08-14 부터 있다** (`app.html`, surfaces 참조). 없는 것은 그 뒤의 전부다: 인증·백엔드·카메라·저장. 데모는 그것들을 대역으로 채운다'
      - 'Core AI 호출 경로 (그림: "ICLO Core AI 연동")'
      - 급여 게이트웨이 (X12 270/271)
      - 급여 표 — 플랜 문서 SPD 는 피드가 없어 수기로 옮겨야 한다
      - 예측 모델
      - '신원 확인 — 동의 강제는 2026-08-16 부터 앱 안에서는 성립한다 (consent_model 참조).
        없는 것은 신원 확인과 서버 측 강제다: 지금 평가는 브라우저에서 일어나고 기록도 거기 산다'
    note: 별도 트랙이며 90일 계획에 포함되지 않는다

  # 2026-08-16 추가. 앱 화면이 실제로 갖게 된 성질 둘. 제안서가 이 둘을 주장하므로
  # 정본에 둔다 — 주장만 있고 정본에 없으면 다음 사람이 지운다.
  built:
    data_boundary:
      file: data/member-demo.json
      rule: |
        app.html 안에 회원 데이터가 없다. 계정·플랜·보장률·치과·동의가 전부 이 파일에서
        오고, 파일이 없으면 화면은 오류를 띄우고 멈춘다. 대체 사본을 두지 않는다 —
        두면 "못 읽었다" 가 "정상" 으로 렌더되고, 이 저장소는 그 실패를 세 번 겪었다.
      enforced_by: test_consent.py
    consent_model:
      shape: '목적별 기록의 append-only 목록: {purpose, granted, policy_version, at}'
      states: [ACTIVE, WITHDRAWN, STALE, NEVER]
      stale: |
        policy_version 이 현재 문안과 다르면 동의는 효력이 없다. 불리언은 이 상태를
        표현하지 못하고 "켜짐" 으로 읽어 바뀐 문안 아래에서 계속 처리한다.
      evaluated: 사용 직전. 가입 시점 플래그를 읽지 않는다
      basis_chain: processing 을 철회하면 photo 가 켜져 있어도 촬영이 막힌다
      enforced_by: test_consent.py
  not_decided:
    - 예측 모델이 무엇을 예측할지 (모델 자체가 does_not_exist 에도 있다)
    - 실험군 배정
    - 가족·보호자 권한의 전체 흐름

