status:
  running_today:
    - 임직원 대시보드 데모 — 합성 숫자를 브라우저 안에서 계산. 실데이터도 Snowflake 연결도 없음.
  designed:
    - 근거 레이어 데이터 모델, 신원 해석 규칙, 정책·품질 계약, 기업 온보딩 절차, 추론 API 계약
