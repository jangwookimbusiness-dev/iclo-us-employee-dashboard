      에디션 판단(9절 A5)에 물린다. 2번(인접 억제)은 억제를 전염시켜 작은 기업
      화면을 비운다 — 250명 하한이 여기서 다시 나온다. 넷을 겹쳐도 완전하지
      않으며, 하는 일은 공격 비용을 올리고 흔적을 남기는 것이다.

