#
# 2026-08-16 신설. 문서마다 "승인 주체는 J. Kim" 이라고 적어두면 적은 쪽은
# 기록했다고 여기지만, 정할 사람은 그 문장이 어느 문서 몇 절에 있는지 모른다.
# 세 문서를 열어야 알 수 있는 상태였다. 여기가 유일한 목록이다.
#
# marker 는 "그 문서가 아직 미결이라고 말하는 문자열" 이다. 검사기가 파일에
# 그 문자열이 실제로 있는지 본다. 결정이 나서 문서의 초안 표시를 지우면 검사가
# 깨지고, 그때 이 항목도 같이 닫게 된다. 이 장치가 없으면 이 목록도 SYNC-07·09
# 처럼 이미 끝난 일을 몇 달째 붙들고 있게 된다 — 그게 이 파일에서 방금 있었던 일이다.
