# 알려진 미해결 — 감사에서 나왔고 아직 안 고친 것
# ─────────────────────────────────────────────────────────────
open_items:
  - id: SYNC-06
    what: 대시보드 화면 이름·KPI 이름이 Report·Proposal 어디에도 등장하지 않는다
    fix: 각 문서의 대시보드 절에서 이 파일의 dashboard.tabs·dashboard.kpis 라벨을 그대로 인용
  - id: SYNC-07
    what: PRD 의 report §9·§10·§11·§13·§15·§17·§18 참조가 전부 끊겼다 (외부 vault 의 v2 report 를 가리킴)
    fix: PRD 상호참조를 이 저장소의 기술문서 절 번호로 교체하거나 참조 자체를 제거
  - id: SYNC-08
    what: stop-loss 가 Report KO 에만 1회. 나머지 4개 문서 0회
    fix: self-funded 설명이 나오는 곳마다 ASO·stop-loss 를 세트로
  - id: SYNC-09
    what: 구현됐으나 이름이 다르다. PRD 는 ?scenario=A, index.html 은 ?scen=A·?tab= 을 쓴다
    fix: PRD §3.4 의 표기를 ?scen= 으로 고친다. 기능은 이미 있다 (2026-08-12 확인)
