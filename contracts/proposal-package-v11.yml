  # 따라서 90일은 관계와 설계를 검증하는 기간으로 다시 규정한다.
  build_in_90_days:
    items:
      - 미국 HLS GTM·아키텍처 담당자와의 연결, 그리고 검증 상대의 확정
      - 근거 레이어 아키텍처 설계와 Snowflake 보안 기준 정렬
      - start_gates 네 항목의 책임자 지정과 종결 경로 합의
    note: |
      실데이터 적재는 이 90일에 포함되지 않는다. start_gates 다섯이 닫힌 뒤에 시작한다.
      이 기간이 검증하는 것은 치아 PoC 자체가 아니라 Snowflake 관계와 설계의 성립 여부다.
      제목이나 본문에서 이 90일을 "치아 PoC 검증"으로 부르지 않는다.
  # 데이터 흐름도(06_Tech/ICLO-데이터흐름도-슬라이드-전체.svg)의 "아직 없는 것" 과
  # 항목 단위로 일치시킨다. 그림과 정본이 다르면 회의에서 둘 중 하나가 거짓이 된다.
  does_not_exist:
    items:
      - '임직원 웹앱 — **화면은 2026-08-14 부터 있다** (`app.html`, surfaces 참조). 없는 것은 그 뒤의 전부다: 인증·백엔드·카메라·저장. 데모는 그것들을 대역으로 채운다'
      - 'Core AI 호출 경로 (그림: "ICLO Core AI 연동")'
      - 급여 게이트웨이 (X12 270/271)
      - 급여 표 — 플랜 문서 SPD 는 피드가 없어 수기로 옮겨야 한다
      - 예측 모델
      - '신원 확인 — 동의 강제는 2026-08-16 부터 앱 안에서는 성립한다 (consent_model 참조).
        없는 것은 신원 확인과 서버 측 강제다: 지금 평가는 브라우저에서 일어나고 기록도 거기 산다'
    note: 별도 트랙이며 90일 계획에 포함되지 않는다

  # 2026-08-16 추가. 앱 화면이 실제로 갖게 된 성질 둘. 제안서가 이 둘을 주장하므로
  # 정본에 둔다 — 주장만 있고 정본에 없으면 다음 사람이 지운다.
  built:
    data_boundary:
      file: data/member-demo.json
      rule: |
        app.html 안에 회원 데이터가 없다. 계정·플랜·보장률·치과·동의가 전부 이 파일에서
        오고, 파일이 없으면 화면은 오류를 띄우고 멈춘다. 대체 사본을 두지 않는다 —
        두면 "못 읽었다" 가 "정상" 으로 렌더되고, 이 저장소는 그 실패를 세 번 겪었다.
      enforced_by: test_consent.py
    consent_model:
      shape: '목적별 기록의 append-only 목록: {purpose, granted, policy_version, at}'
      states: [ACTIVE, WITHDRAWN, STALE, NEVER]
      stale: |
        policy_version 이 현재 문안과 다르면 동의는 효력이 없다. 불리언은 이 상태를
        표현하지 못하고 "켜짐" 으로 읽어 바뀐 문안 아래에서 계속 처리한다.
      evaluated: 사용 직전. 가입 시점 플래그를 읽지 않는다
      basis_chain: processing 을 철회하면 photo 가 켜져 있어도 촬영이 막힌다
      enforced_by: test_consent.py
  not_decided:
    - 예측 모델이 무엇을 예측할지 (모델 자체가 does_not_exist 에도 있다)
    - 실험군 배정
    - 가족·보호자 권한의 전체 흐름

