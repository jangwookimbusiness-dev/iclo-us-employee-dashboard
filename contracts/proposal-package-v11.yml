# ICLO × Snowflake 제안 패키지 — 정본 (canonical contract)
#
# 이 파일이 하나의 정본이다. 대시보드 코드·기술문서·Report·Proposal·PRD가
# 서로 다른 말을 하기 시작한 것이 2026-08-09 정합성 감사의 결론이었고,
# 그 원인은 정본이 셋(PRD / 기술문서 / index.html)으로 갈라져 있었던 것이다.
#
# 값을 바꿀 때: 여기를 먼저 바꾸고 → scripts/check-package-consistency.py 를 돌려
# 어느 산출물이 어긋나는지 확인한 뒤 → 그 산출물을 고친다. 역순으로 하지 않는다.
#
# 검사기: scripts/check-package-consistency.py
# 감사 근거: 2026-08-09 sync audit (Claude + codex)

meta:
  package: proposal-v10
  updated: 2026-08-09
  owner: Jangwoo Kim

# ─────────────────────────────────────────────────────────────
# 산출물 — 무엇이 정본이고 무엇이 파생인가
# ─────────────────────────────────────────────────────────────
artifacts:
  dashboard:
    path: index.html
    kind: 배포된 데모
    spec: employer-dashboard-poc/docs/PRD.md
    note: 코드는 루트, 스펙은 옆 폴더. index.html 에서 PRD 를 가리키는 것이 없으므로 반드시 함께 연다.
  tech:
    path: output/proposal-v10/06_Tech/ICLO-Evidence-Layer-DB-설계-KO.md
    kind: 기술 주장의 정본
    builder: scratchpad tech/build.py
  diagram:
    kind: 파생 (기술문서 기준). 2026-08-09 에 한 장을 세 장으로 나눔.
    why_split: |
      2000px 한 장짜리는 실제 배포되는 두 곳에서 판독 한계 아래였다 —
      기술문서 PDF(A4 가로) 본문 중앙값 4.4pt, 1-pager 슬라이드 5.0px.
      글자 크기가 아니라 축소 배율(0.39~0.48×) 문제라 캔버스를 줄여야 했다.
      rendered_pt = font_px × (page_inch × 72) / viewbox_width
    sheets:
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-A-원천과정본.svg      # 1240×900
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-B-통제와노출.svg      # 1240×880
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-C-경계와미결.svg      # 1240×664
    slide_variant:
      path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-슬라이드-전체.svg   # 1180×642 — 제목은 슬라이드 헤더가 갖는다
      what: 1-pager 는 전체 흐름을 한 장에 본다 — 세 장 분할은 기술문서에만 적용.
      how: 골격(3구역 · ①~⑦)은 그대로 두고 세부 설명줄을 뺀 개요판. 슬롯 9.50in 에서 7.5pt.
    generator: scratchpad svg/gen.py — 상자 넘침과 텍스트 겹침을 생성 시 검사한다
    min_pt: A4 가로에서 최소 7.1pt (이전 3.9pt)
  report_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Report-v10-KO-Internal.docx
    kind: 내부 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  INTERNAL REVIEW"
  report_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Report-v10-EN-External.docx
    kind: 대외 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  JOINT VALIDATION REPORT"   # Proposal 과 같은 머리글을 쓰면 안 된다
  proposal_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Proposal-v10-KO-Internal.pptx
    kind: 내부 덱
    builder: tmp/iclo-snowflake-proposal-v10/build_decks_v10.mjs
  proposal_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Proposal-v10-EN-External-Notes-Stripped.pptx
    kind: 대외 덱 — 실제로 나가는 문서
    builder: tmp/iclo-snowflake-proposal-v10/build_decks_v10.mjs

# ─────────────────────────────────────────────────────────────
# 대시보드 화면 — 코드에 있는 문자열이 정본이다
# 문서가 대시보드를 설명할 때 이 이름을 그대로 써야 대응이 된다
# ─────────────────────────────────────────────────────────────
dashboard:
  title: ICLO HomeDen Employer Analytics
  tabs:                     # index.html TABS 상수와 1:1
    - key: overview
      label: Overview
      heading: Program overview
    - key: signals
      label: Signals
      heading: Oral-health signal distribution
    - key: funnel
      label: Funnel
      heading: Intervention funnel
  views_deferred:
    - name: Preventive-visit Trend vs Control
      reason: 실험군 배정에 동의 근거·배정 규칙·프로토콜 책임자가 없다
      returns_when: 법무·프로토콜 승인 후
      note: PRD 원안의 4번째 뷰. 의도적 보류이며 미구현이 아니다.

  kpis:                     # 화면 라벨 = 정본. 문서는 이 문자열을 쓴다.
    - label: Eligible employees
      const: null
      definition_ko: 기준 시점에 플랜 자격이 있는 임직원 수
      source: HRIS · 834 eligibility
    - label: Activated (registered + first questionnaire)
      const: FRAC.activated
      value: 0.38
      definition_ko: 가입 + 첫 문진 완료 / 자격자
      source: App · consent + events
    - label: Valid capture (passed photo-quality gate)
      const: FRAC.valid
      value: 0.28
      definition_ko: 품질 게이트를 통과한 촬영
      source: App · photo-derived signals (versioned)
      gap: 기술문서 §3 화면 지표표에 이 항목이 없다 — 추가해야 한다
    - label: Open care actions
      const: FRAC.gap
      value: 0.095
      definition_ko: 발생한 조치
      source: App events + TPA claims-confirmed
    - label: Completed actions
      const: FRAC.closed
      value: 0.042
      definition_ko: 청구로 확인된 완료 (confidence HIGH 만)
      source: App events + TPA claims-confirmed

  repeat_participation:
    const: FRAC.repeat
    value: 0.61
    definition_ko: 2회 이상 유효 촬영한 사람 / 활성 사용자

  signals:                  # PRD §4b 5항과 index.html SIGNALS 가 일치해야 한다
    - {key: Low,      share: 52}
    - {key: Moderate, share: 33}
    - {key: Priority, share: 15}

  scenarios:                # PRD §2, index.html SCEN, 기술문서 §14.4 세 곳 일치
    - {key: A, employees: 10000, pmpm: 31.4, label: baseline}
    - {key: B, employees: 2500,  pmpm: 32.8, label: small}
    - {key: C, employees: 25000, pmpm: 30.9, label: large}

  constants:
    min_cell: 20            # 기업 화면 최소 셀. 기술문서 가정 A8, PRD 레드라인
    dep_ratio: 2.2          # 자격자당 가입 인원. 기술문서 "member_month 약 22,000행" 과 정합
    lag_days: 60            # 데모 표시값. 실제는 분포(중앙값 45·롱테일 180) — 기술문서 §6.3
    completeness_pct: 98.4  # 합성 데모 값. 실데이터에서는 지연 곡선 출처를 밝혀야 한다
    eligibility_thru: "2026-07"
    claims_thru: "2026-05"

  # 부스 라이브 캡처 — 2026-08-12 결정 (J. Kim) 으로 폐기.
  # SWT Seoul 부스는 A/B/C 합성 시나리오만 띄운다. 방문자 촬영·명찰 QR·연락처 수집·
  # 부스 employer(LIVE) 를 전부 걷어냈고 index.html 과 capture.html 에서도 지웠다.
  # PRD §2.5 의 "Seoul-only · 폐기" 열이 그대로 실행된 것이며, "survives" 열은 남는다.
  #
  # 여기서 같이 사라진 것: PIPA §23 민감정보 처리, 부스 동의문, 명찰 HMAC,
  # 5건 배치 갱신 가드, "U.S. GTM sample" 탭 이름, 촬영 앱.
  # 미국 PoC 에서는 기업·TPA·임직원 앱 실데이터로 대시보드를 채운다. 그 설계는
  # 기술문서와 start_gates 가 계속 관장한다.

  colors:                   # PRD §3·§5.6 레드라인
    coral: "#C2333A"        # 원안 #FF7A79 는 흰 배경에서 2.53:1 로 WCAG AA 미달이었다.
                            # 2026-08-08 design review 에서 5.49:1 로 교체. PRD 갱신 완료.
    coral_dark_mode: "#FF8E8D"
    bars:                   # WCAG 1.4.11 — 의미를 싣는 비텍스트는 3:1. 서열은 휘도로 유지.
      light: {Low: "#7E90AE", Moderate: "#4E8F98", Priority: "#C2333A"}   # 3.05 / 3.46 / 5.16
      dark:  {Low: "#5B7099", Moderate: "#4FA0A9", Priority: "#FF8E8D"}   # 3.51 / 5.77 / 7.91
      was: 원래 #D9E1EE / #8FB8BE 는 1.24 / 2.02 로, 데이터의 53% 를 싣는 Low 가 안 보였다.
    navy: "#1B2A4A"
    teal: "#007A87"
    background: "#FFFFFF"
    rule: 라이트 계열 정의(:root 와 :root[data-theme="light"])는 같은 coral 을 써야 한다

  implementation:
    actual: 단일 vanilla HTML + 인라인 CSS/JS (index.html) 하나. capture.html 은 2026-08-12 삭제
    store: 없음. 부스는 브라우저 안 합성 계산만 한다
    inference: 부스에서는 호출하지 않는다. Core AI 호출 계약은 미국 제품 몫으로 기술문서 §8.2 가 관장
    freeze: 2026-08-25
    event: Snowflake World Tour Seoul · COEX · 2026-08-27
    booth_device: iPad Pro 12.9인치 가로 (1366×1024). Overview 가 934px 라 들어간다.
    booth_scope: A/B/C 합성 시나리오만. 방문자 촬영 없음 (2026-08-12 결정)
    touch: 모든 컨트롤 44px 무조건. hover:none 게이트는 키보드 붙은 iPad 에서 안 걸린다.
    chips: 탭하면 적재 경로가 열린다. title 전용이면 태블릿에서 그 정보가 없는 것과 같다.
    not: Vite + React 18 + TypeScript + Tailwind + Recharts
    note: PRD 원안 스택은 미채택. package.json·src·dist 없음. AGENTS.md 의 npm 명령은 실행 불가.

# ─────────────────────────────────────────────────────────────
# 절대 표현 — 범위를 좁히지 않으면 사실과 다른 주장이 된다
# ─────────────────────────────────────────────────────────────
scoped_claims:
  - wrong: "no individual PHI"
    right: "no individual PHI in employer views"
    why: 가입자-월·청구 항목은 개인 단위 레코드 없이 계산할 수 없다. 관리형 처리 레이어에는 개인 레벨 데이터가 존재한다. 통제 대상은 데이터의 존재가 아니라 열람 권한이다. (기술문서 §2.1)
  - wrong: "집계만, 개인정보 없음"
    right: "집계 전용 · 최소 셀은 고유 인물 기준 · 기업 격리"
    why: MIN_GROUP_SIZE 는 기본적으로 행 수를 센다. ENTITY KEY (party_sk) 가 있어야 고유 인물 수로 센다. (기술문서 §10.3)
  - wrong: "실험군 배정 + 청구로 확인한 결과"
    right: "청구로 확인한 결과 (실험군 배정은 법무·프로토콜 승인 후)"
    why: 배정 규칙·동의 근거·프로토콜 책임자가 없다

# ─────────────────────────────────────────────────────────────
# 용어 — 좌변을 쓰면 안 되고 우변을 쓴다
# ─────────────────────────────────────────────────────────────
terminology:
  forbidden:
    - {wrong: "보험자 지급액",  right: "플랜 지급액",  why: self-funded 에서 돈을 내는 주체는 기업이지 보험사가 아니다}
    - {wrong: "보험사가 지급",  right: "플랜이 지급",  why: 같음}
    - {wrong: "HRIS 834",      right: "기업 또는 benefits administrator 가 제공하는 자격 파일, 통상 X12 834", why: 834 를 HRIS 가 직접 뱉는 것이 아니다}
    - {wrong: "Review",        right: "Priority",     why: PRD 레드라인. 신호 라벨}
  disease_words_banned:      # PRD §5.6 · scripts/check-forbidden-terms.sh
    [diagnos, cavit, caries, decay, gingivit, periodont, abscess, lesion]
  pairs:                     # 두 개념을 섞어 쓰지 않는다
    - payer / carrier:  payer 는 비용 부담 주체(self-funded 는 기업), carrier 는 보험 상품 제공자
    - self-funded / ASO / stop-loss:  셋을 세트로 표기한다
    - plan_paid / allowed / member_oop:  합치지 않고 분리해서 저장·표시한다
  ko_en:
    플랜 지급액: plan-paid
    허용액: allowed
    본인부담: member out-of-pocket
    자격 파일: eligibility file
    청구 지연: claims lag
    최소 셀: minimum cell size
    가입자-월: member-month

# ─────────────────────────────────────────────────────────────
# 착수 게이트 — 실데이터 적재 전에 서면으로 닫아야 하는 넷
# 대외 문서(Report EN · Proposal EN)에 반드시 노출한다
# ─────────────────────────────────────────────────────────────
start_gates:
  - id: hipaa_roles
    ko: HIPAA 역할 규정
    en: HIPAA roles
    what: ICLO·기업·기업 건강플랜·TPA·Snowflake 각각이 covered entity / business associate / subcontractor 중 무엇인가. BAA 체인은 이 판정 위에 세운다.
    if_open: PHI 를 적재할 법적 근거가 없다
  - id: data_rights
    ko: 데이터 권리
    en: Data rights
    what: 기업–TPA 계약의 데이터 권리 조항 — 원천별·필드별·목적별로 무엇을 받고 무엇에 쓸 수 있는가
    if_open: 데이터를 받고도 쓸 수 없다. 지연의 대부분이 여기서 생긴다.
  - id: baseline_before_consent
    ko: 동의 이전 기준선 적재
    en: Baseline load before consent
    what: 기준선 적재가 동의보다 앞선다. 그 시점에 동의한 사람은 없고 파일럿에서 끝내 동의하지 않을 사람이 다수다. 집계 전용 기준선을 택하거나 별도 법적 근거를 서면으로 정한다.
    if_open: 비동의자의 PHI 를 근거 없이 처리하게 된다. 예외가 아니라 구조적 문제다.
  - id: common_identity_key
    ko: 공통 식별키
    en: Common identity key
    what: 인사 쪽과 TPA 쪽 양쪽에 사람을 연결할 안정적 식별자가 있는가
    if_open: 청구와 앱 이용을 연결할 수 없어 "청구로 확인된 완료" 주장 자체가 성립하지 않는다

# ─────────────────────────────────────────────────────────────
# 현재 상태 — 무엇이 돌아가고 무엇이 없는가
# 대외 문서에 반드시 노출한다. 설계를 운영처럼 쓰지 않는다.
# ─────────────────────────────────────────────────────────────
status:
  running_today:
    - 임직원 대시보드 데모 — 합성 숫자를 브라우저 안에서 계산. 실데이터도 Snowflake 연결도 없음.
  designed:
    - 근거 레이어 데이터 모델, 신원 해석 규칙, 정책·품질 계약, 기업 온보딩 절차, 추론 API 계약
  # 2026-08-12 결정 (J. Kim). 이전 값은 "Snowflake 위의 실데이터 근거 레이어와
  # 실데이터 대시보드" 였고, 그것은 90일 안에 성립하지 않는다. QA-Checklist-v10 80행이
  # 이미 지적했다 — 기업 약정도, 계약된 데이터도, 적재된 청구도, 측정된 결과도 없다.
  # 실데이터를 넣으려면 start_gates 넷이 먼저 서면으로 닫혀야 하고 그건 90일 밖이다.
  # 따라서 90일은 관계와 설계를 검증하는 기간으로 다시 규정한다.
  build_in_90_days:
    - 미국 HLS GTM·아키텍처 담당자와의 연결, 그리고 검증 상대의 확정
    - 근거 레이어 아키텍처 설계와 Snowflake 보안 기준 정렬
    - start_gates 네 항목의 책임자 지정과 종결 경로 합의
    note: |
      실데이터 적재는 이 90일에 포함되지 않는다. start_gates 넷이 서면으로 닫힌 뒤에 시작한다.
      이 기간이 검증하는 것은 치아 PoC 자체가 아니라 Snowflake 관계와 설계의 성립 여부다.
      제목이나 본문에서 이 90일을 "치아 PoC 검증"으로 부르지 않는다.
  does_not_exist:
    - 임직원 웹앱
    - Core AI 호출 경로
    - 급여 게이트웨이 (X12 270/271)
    note: 별도 트랙이며 90일 계획에 포함되지 않는다
  not_decided:
    - 예측 모델의 예측 대상
    - 실험군 배정
    - 가족·보호자 권한의 전체 흐름

# ─────────────────────────────────────────────────────────────
