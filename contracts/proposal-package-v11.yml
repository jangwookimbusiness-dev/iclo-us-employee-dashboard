# ICLO × Snowflake 제안 패키지 — 정본 (canonical contract)
#
# 이 파일이 하나의 정본이다. 대시보드 코드·기술문서·Report·Proposal·PRD가
# 서로 다른 말을 하기 시작한 것이 2026-08-09 정합성 감사의 결론이었고,
# 그 원인은 정본이 셋(PRD / 기술문서 / index.html)으로 갈라져 있었던 것이다.
#
# 값을 바꿀 때: 여기를 먼저 바꾸고 → scripts/check-package-consistency.py 를 돌려
# 어느 산출물이 어긋나는지 확인한 뒤 → 그 산출물을 고친다. 역순으로 하지 않는다.
#
# 검사기: scripts/check-package-consistency.py
# 감사 근거: 2026-08-09 sync audit (Claude + codex)

meta:
  package: proposal-v10
  updated: 2026-08-09
  owner: Jangwoo Kim

# ─────────────────────────────────────────────────────────────
# 산출물 — 무엇이 정본이고 무엇이 파생인가
# ─────────────────────────────────────────────────────────────
artifacts:
  dashboard:
    path: index.html
    kind: 배포된 데모
    spec: employer-dashboard-poc/docs/PRD.md
    note: 코드는 루트, 스펙은 옆 폴더. index.html 에서 PRD 를 가리키는 것이 없으므로 반드시 함께 연다.
  tech:
    path: output/proposal-v10/06_Tech/ICLO-Evidence-Layer-DB-설계-KO.md
    kind: 기술 주장의 정본
    builder: scratchpad tech/build.py
  diagram:
    kind: 파생 (기술문서 기준). 2026-08-09 에 한 장을 세 장으로 나눔.
    why_split: |
      2000px 한 장짜리는 실제 배포되는 두 곳에서 판독 한계 아래였다 —
      기술문서 PDF(A4 가로) 본문 중앙값 4.4pt, 1-pager 슬라이드 5.0px.
      글자 크기가 아니라 축소 배율(0.39~0.48×) 문제라 캔버스를 줄여야 했다.
      rendered_pt = font_px × (page_inch × 72) / viewbox_width
    sheets:
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-A-원천과정본.svg      # 1240×900
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-B-통제와노출.svg      # 1240×880
      - path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-C-경계와미결.svg      # 1240×664
    slide_variant:
      path: output/proposal-v10/06_Tech/ICLO-데이터흐름도-슬라이드-전체.svg   # 1180×642 — 제목은 슬라이드 헤더가 갖는다
      what: 1-pager 는 전체 흐름을 한 장에 본다 — 세 장 분할은 기술문서에만 적용.
      how: 골격(3구역 · ①~⑦)은 그대로 두고 세부 설명줄을 뺀 개요판. 슬롯 9.50in 에서 7.5pt.
    generator: scratchpad svg/gen.py — 상자 넘침과 텍스트 겹침을 생성 시 검사한다
    min_pt: A4 가로에서 최소 7.1pt (이전 3.9pt)
  report_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Report-v10-KO-Internal.docx
    kind: 내부 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  INTERNAL REVIEW"
  report_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Report-v10-EN-External.docx
    kind: 대외 검토본
    builder: tmp/iclo-snowflake-proposal-v10/build_reports_v10.py
    header: "ICLO × SNOWFLAKE  |  JOINT VALIDATION REPORT"   # Proposal 과 같은 머리글을 쓰면 안 된다
  proposal_ko:
    path: output/proposal-v10/01_KO_Internal/ICLO-Snowflake-Joint-Validation-Proposal-v10-KO-Internal.pptx
    kind: 내부 덱
    builder: tmp/iclo-snowflake-proposal-v10/build_decks_v10.mjs
  proposal_en:
    path: output/proposal-v10/02_EN_External/ICLO-Snowflake-Joint-Validation-Proposal-v10-EN-External-Notes-Stripped.pptx
