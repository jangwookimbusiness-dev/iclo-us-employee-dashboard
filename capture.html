<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICLO 부스 시연</title>
<!--
  SWT Seoul 2026-08-27 부스 촬영 웹앱.
  문안 정본은 employer-dashboard-poc/docs/consent-ko.md (법률 검토 전).
  PRD 2.5 기준 폐기 대상 — 8/27 에 돌면 되고 그 뒤에는 지운다.
  화면 확인용: ?s=1..5 로 각 단계를 바로 연다.
-->
<style>
  :root{
    --coral:#C2333A; --teal:#007A87; --navy:#1B2A4A;
    --ground:#FFFFFF; --field:#F7F8FA; --line:#E3E8F0;
    --ink:#1B2A4A; --ink2:#5B6B85;
    --mono:ui-monospace,"SFMono-Regular",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.62;-webkit-font-smoothing:antialiased;
    word-break:keep-all;overflow-wrap:break-word}
  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:9px}
  .logo{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .hs{font-size:12px;color:var(--ink2)}
  .step{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  main{flex:1;padding:20px}
  h1{font-size:20px;font-weight:700;margin:0 0 6px;line-height:1.35}
  .sub{font-size:13.5px;color:var(--ink2);margin:0 0 18px}
  h2{font-size:14px;font-weight:700;margin:20px 0 6px}
  p{margin:0 0 12px}
  .small{font-size:13px;color:var(--ink2)}
  table{width:100%;border-collapse:collapse;margin:8px 0 4px;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border:1px solid var(--line);vertical-align:top}
  th{background:var(--field);font-weight:600;width:44%}
  .no td:first-child{color:var(--ink2)}
  .box{border:1px solid var(--line);border-radius:6px;padding:13px 15px;background:var(--field);
    font-size:13px;margin:12px 0}
  .box.teal{border-color:var(--teal);border-left:3px solid var(--teal);background:#F2F8F8}
  .agree{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--navy);
    border-radius:6px;padding:14px;margin:18px 0 14px;background:var(--ground)}
  .agree input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--navy);flex:none}
  .agree label{font-size:14px;font-weight:600;line-height:1.5}
  .req{color:var(--coral);font-weight:700}
  .opt{color:var(--ink2);font-weight:400}
  button{font-family:inherit;font-size:15px;font-weight:600;border-radius:6px;
    padding:15px 18px;width:100%;cursor:pointer;border:1px solid var(--navy);min-height:52px}
  .primary{background:var(--navy);color:#fff}
  .primary:disabled{background:#C7CEDC;border-color:#C7CEDC;color:#fff;cursor:not-allowed}
  .ghost{background:none;color:var(--ink2);border-color:var(--line);margin-top:9px}
  button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
  footer{padding:14px 20px 22px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line)}
  /* 촬영 프레임 */
  .frame{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:8px;background:var(--field);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    color:var(--ink2);font-size:13px;margin:14px 0}
  .frame .ico{font-size:34px;line-height:1}
  .scan{aspect-ratio:1;max-height:210px;margin:14px auto;border:2px solid var(--teal);border-radius:8px;
    background:var(--field);display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:6px;color:var(--ink2);font-size:13px}
  /* 결과 */
  .band{font-family:var(--mono);font-size:40px;font-weight:700;color:var(--teal);line-height:1.1;
    margin:4px 0 2px}
  .bandnote{font-size:13px;color:var(--ink2);margin-bottom:16px}
  .ok{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--teal);
    border:1px solid var(--teal);border-radius:3px;padding:3px 8px;margin-bottom:14px}
  .warn{border-left:3px solid var(--coral);background:#FDF4F4;border:1px solid var(--coral);
    border-radius:6px;padding:12px 14px;font-size:13px;margin:14px 0}
  input[type=text],input[type=email]{width:100%;font-family:inherit;font-size:16px;padding:13px;
    border:1px solid var(--line);border-radius:6px;background:var(--ground);color:var(--ink);
    margin-bottom:10px;min-height:50px}
  input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">ICLO</span>
    <span class="hs">부스 시연</span>
    <span class="step" id="step"></span>
  </header>
  <main id="v"></main>
  <footer id="f">본 시연은 진단이 아닙니다. 치과 진료를 대체하지 않습니다.</footer>
</div>

<script>
"use strict";
// 화면 정본: docs/consent-ko.md. 문안을 여기서 고치지 말고 그 문서를 먼저 고친다.
const $ = id => document.getElementById(id);
let s = Number(new URLSearchParams(location.search).get("s") || 1);

const SCREENS = {

// ── 1. 민감정보 처리 동의 (필수) ─────────────────────────────────
// PIPA 23조: 민감정보 동의는 다른 동의와 분리해서 받는다. 이 화면에는
// 연락처도 마케팅도 약관도 올리지 않는다.
1: () => `
  <h1>구강 사진 처리 동의</h1>
  <p class="sub">ICLO는 이 부스에서 구강 사진으로 구강 상태 신호 등급을 산출하는 과정을 시연합니다.
  구강 사진은 개인정보 보호법상 <b>민감정보(건강에 관한 정보)</b>에 해당하여, 동의하신 경우에만 진행합니다.</p>

  <h2>1. 처리 목적</h2>
  <p>부스 시연 — 촬영한 사진에서 신호 등급을 산출해 <b>본인에게만</b> 보여드리고,
  개인을 알아볼 수 없는 집계로 부스 화면에 반영합니다.
  <b class="req">진단이 아니며 의료적 판단에 사용할 수 없습니다.</b></p>

  <h2>2. 처리 항목</h2>
  <table>
    <tr><th>구강 사진</th><td><b>저장하지 않습니다.</b> 분석 직후 즉시 삭제되며 서버에 기록되지 않습니다</td></tr>
    <tr><th>신호 등급<br>LOW / MODERATE / PRIORITY</th><td>저장합니다</td></tr>
    <tr><th>촬영 시각, 모델 버전</th><td>저장합니다</td></tr>
    <tr><th>명찰 QR</th><td>읽는 즉시 복원 불가능한 값으로 변환해 저장합니다.
      <b>이름·회사·연락처는 저장하지 않습니다</b></td></tr>
  </table>

  <h2>3. 부스 화면에 무엇이 올라가는지</h2>
  <table>
    <tr><th>촬영 건수</th><td>"오늘 촬영 N건"의 숫자가 1 올라갑니다 · 촬영 직후</td></tr>
    <tr><th>신호 분포 막대</th><td>귀하의 등급 막대에 <b>한 명분</b>이 더해집니다. 누구인지는 표시되지 않습니다 · 촬영 5건이 모인 뒤</td></tr>
  </table>
  <div class="box teal">촬영 직후에 막대를 움직이지 않는 이유가 있습니다. 바로 움직이면
  화면을 보던 사람이 방금 촬영하신 분의 등급을 알게 됩니다. 그래서 5건씩 묶어 반영합니다.
  20명 미만인 항목은 값 대신 "표시할 수 없음"으로 나옵니다.</div>
  <p class="small"><b>올라가지 않는 것</b> — 구강 사진(저장 자체를 안 함) · 이름·회사·연락처 ·
  촬영 시각(기록하지만 화면에 표시하지 않음) · 개인의 등급을 개인과 함께 보여주는 화면(그런 화면이 없습니다)</p>

  <h2>4. 화면을 채우는 나머지는 가상 정보입니다</h2>
  <p>부스 화면은 미국 기업 고객용 대시보드입니다. 원래는 회사가 제공하는 재직·보험 자격 정보가 있어야
  완성되는데 이 자리에서는 받지 않습니다. 그래서 <b>부서·근속·진료 청구 같은 항목은 무작위로 만든 가상값</b>입니다.
  귀하에게서 온 것은 <b>신호 등급 하나뿐</b>이며, 화면에도 어느 숫자가 실제이고 어느 것이 가상인지 표시됩니다.</p>

  <h2>5. 보유 및 이용 기간</h2>
  <p>명찰에서 변환된 값은 <b>행사 당일 종료 시 파기</b>합니다. 파기 후 남는 기록은 특정 개인과
  연결되지 않으며 시연 통계 목적으로만 이용합니다. 데이터는 국내에 저장됩니다.</p>

  <h2>6. 동의를 거부할 권리</h2>
  <p>동의하지 않으실 수 있습니다. <b>거부하셔도 부스 관람과 제품 설명에는 아무런 제한이 없습니다.</b>
  촬영이 진행되지 않을 뿐입니다.</p>

  <p class="small">만 14세 미만은 법정대리인 동의가 필요하여 참여하실 수 없습니다.<br>
  문의: ICLO 개인정보 담당 · privacy@iclo.example · 02-0000-0000</p>

  <div class="agree">
    <input type="checkbox" id="ck" onchange="$('go').disabled=!this.checked">
    <label for="ck">위 내용을 확인했으며 구강 사진 처리에 동의합니다. <span class="req">(필수)</span></label>
  </div>
  <button class="primary" id="go" disabled onclick="go(2)">동의하고 시작하기</button>
  <button class="ghost" onclick="go(9)">동의하지 않음</button>`,

// ── 2. 명찰 스캔 ────────────────────────────────────────────────
2: () => `
  <h1>명찰의 QR을 비춰 주세요</h1>
  <p class="sub">같은 분이 두 번 촬영하는 것을 막기 위한 확인 단계입니다.</p>
  <div class="scan"><div style="font-size:30px">▣</div>명찰 QR을 사각형 안에</div>
  <div class="box teal"><b>이름과 연락처는 저장하지 않습니다.</b>
  읽는 즉시 복원 불가능한 값으로 바꾸고 원본은 버립니다. 이 값도 오늘 행사가 끝나면 파기합니다.</div>
  <button class="primary" onclick="go(3)">스캔 완료 (시연용)</button>
  <button class="ghost" onclick="go(3)">명찰 없이 진행</button>`,

// ── 3. 구강 촬영 ────────────────────────────────────────────────
3: () => `
  <h1>구강을 촬영해 주세요</h1>
  <p class="sub">입을 벌리고 앞니가 가운데 오도록 맞춰 주세요.</p>
  <div class="frame"><span class="ico">◉</span>카메라 미리보기</div>
  <p class="small">촬영한 사진은 분석 서버로 한 번 전송된 뒤 <b>즉시 삭제</b>됩니다.
  휴대폰 앨범에도 저장되지 않습니다.</p>
  <button class="primary" onclick="go(4)">촬영</button>
  <button class="ghost" onclick="go(9)">그만두기</button>`,

// ── 4. 결과 (본인 기기에만) ─────────────────────────────────────
4: () => `
  <span class="ok">사진 삭제 완료</span>
  <h1 style="margin-bottom:0">신호 등급</h1>
  <div class="band">MODERATE</div>
  <div class="bandnote">guided self-care + benefit navigation</div>

  <div class="box">지금 부스 화면의 집계에 한 사람으로 포함되셨습니다 — <b>134명 중 한 분</b>입니다.<br><br>
  저 화면에 올라간 것은 <b>MODERATE 막대에 더해진 한 명분</b>이 전부입니다.
  부서·근속처럼 함께 보이는 항목은 가상값입니다.</div>

  <div class="box teal"><b>부스 화면에서 본인을 찾을 수는 없습니다.</b>
  20명 미만인 항목은 값이 표시되지 않고, 분포는 촬영 5건마다 갱신되므로 어떤 변화도 특정인과
  연결되지 않습니다. 직접 확인해 보십시오.</div>

  <div class="warn">이 등급은 진단이 아닙니다. 치과 진료를 대체하지 않으며,
  치료가 필요한지는 치과에서 확인하셔야 합니다.</div>

  <button class="primary" onclick="go(5)">이야기 더 듣기</button>
  <button class="ghost" onclick="go(9)">여기까지</button>`,

// ── 5. 연락처 (선택) — 1번 화면과 절대 합치지 않는다 ────────────
5: () => `
  <h1>연락처를 남기시겠습니까?</h1>
  <p class="sub">남기지 않으셔도 괜찮습니다. 방금 보신 결과와 부스 이용에는 아무 영향이 없습니다.</p>

  <table>
    <tr><th>수집 목적</th><td>ICLO 제품·사업 관련 후속 연락</td></tr>
    <tr><th>수집 항목</th><td>이름, 회사, 이메일</td></tr>
    <tr><th>보유 기간</th><td>수집일로부터 1년, 또는 삭제 요청 시 즉시</td></tr>
  </table>

  <div class="box teal">여기 남기시는 연락처는 <b>앞서 촬영하신 기록과 연결되지 않습니다.</b>
  두 정보는 서로 다른 곳에 따로 저장되며, 어느 연락처가 어느 촬영인지 저희도 알 수 없습니다.</div>

  <input type="text" placeholder="이름" aria-label="이름">
  <input type="text" placeholder="회사" aria-label="회사">
  <input type="email" placeholder="이메일" aria-label="이메일">

  <div class="agree">
    <input type="checkbox" id="ck2" onchange="$('go2').disabled=!this.checked">
    <label for="ck2">연락처 수집·이용에 동의합니다. <span class="opt">(선택)</span></label>
  </div>
  <button class="primary" id="go2" disabled onclick="go(9)">남기기</button>
  <button class="ghost" onclick="go(9)">괜찮습니다</button>`,

// ── 9. 종료 ─────────────────────────────────────────────────────
9: () => `
  <h1>감사합니다</h1>
  <p class="sub">부스 화면과 제품 설명은 언제든 편하게 보고 가세요.</p>
  <div class="box">촬영하신 사진은 저장되지 않았습니다. 궁금한 점은 부스 담당자에게 말씀해 주세요.</div>
  <button class="ghost" onclick="go(1)">처음으로</button>`,
};

const LABEL = {1:"동의", 2:"명찰", 3:"촬영", 4:"결과", 5:"연락처", 9:""};
function go(n){ s = n; render(); window.scrollTo(0,0); }
function render(){
  $("v").innerHTML = SCREENS[s]();
  $("step").textContent = LABEL[s] ? `${LABEL[s]}` : "";
  $("f").style.display = s===1 ? "none" : "";   // 1번은 본문에 이미 고지가 있다
}
render();
</script>
</body>
</html>
