<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ICLO — My oral wellness</title>
<style>
  /* Tokens are the dashboard's (index.html). One brand, two surfaces.
     Coral is #C2333A, not the original #FF7A79 — that was 2.53:1 on white. */
  :root{
    --coral:#C2333A; --teal:#007A87;
    --ground:#F4F6FA; --panel:#FFFFFF; --field:#F7F8FA; --line:#E3E8F0;
    --ink:#1B2A4A; --ink2:#5B6B85; --band:#EDF1F7;
    --barLow:#7E90AE; --barMid:#4E8F98;
    --strong:#1B2A4A; --onStrong:#FFFFFF; --data:#007A87;
    --shadow:0 1px 2px rgba(27,42,74,.06);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0B1120; --panel:#152038; --field:#0F1930; --line:#28324C;
      --ink:#E7ECF5; --ink2:#95A2BE; --band:#182541;
      --barLow:#5B7099; --barMid:#4FA0A9; --strong:#C9D4EA; --onStrong:#0E1526;
      --data:#3FB6C0; --coral:#FF8E8D; --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
       font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--panel);
         box-shadow:0 0 40px rgba(27,42,74,.08);display:flex;flex-direction:column}
  header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;position:sticky;top:0;background:var(--panel);z-index:5}
  .logo{font-weight:800;letter-spacing:.02em}
  .who{font-size:12px;color:var(--ink2);margin-left:auto;font-family:var(--mono)}
  .gearbtn{width:44px;min-height:44px;padding:0;border:1px solid var(--line);
           border-radius:10px;background:var(--panel);color:var(--ink2);font-size:16px;
           cursor:pointer;flex:0 0 auto}
  .synth{font-family:var(--mono);font-size:11px;color:var(--coral);
         border:1px solid var(--coral);border-radius:4px;padding:3px 7px;
         text-align:center;margin:10px 20px 0}
  main{flex:1;padding:18px 20px 96px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
  h2{font-size:15px;margin:22px 0 8px}
  p{margin:0 0 12px;color:var(--ink2);font-size:14px}
  .card{background:var(--field);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}

  /* The band is the result. There is no number on this screen by design —
     see the comment above direction() in the script. */
  .bandhero{display:inline-block;font-size:30px;font-weight:800;letter-spacing:-.01em;
            color:#fff;border-radius:12px;padding:10px 20px;margin:6px 0 4px}
  .bandtag{display:inline-block;font-family:var(--mono);font-size:12px;
           padding:4px 10px;border-radius:999px;color:#fff}
  .b-low{background:var(--barLow)} .b-mod{background:var(--barMid)} .b-pri{background:var(--coral)}
  .delta{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:8px}

  .track{height:10px;background:var(--band);border-radius:999px;overflow:hidden;margin:6px 0 2px}
  .fill{height:100%;border-radius:999px}
  .rowlab{display:flex;justify-content:space-between;font-size:13px;gap:12px}
  .rowlab .v{font-family:var(--mono)}
  .muted{color:var(--ink2);font-size:12.5px}
  .tpalink{display:inline-block;margin-top:9px;font-size:12.5px;text-decoration:none;
           min-height:44px;line-height:44px;color:var(--data)}

  button,.btn{min-height:44px;font:inherit;font-size:15px;border-radius:10px;
              border:1px solid var(--line);background:var(--panel);color:var(--ink);
              padding:11px 16px;cursor:pointer;width:100%}
  .primary{background:var(--strong);color:var(--onStrong);border-color:var(--strong);font-weight:600}
  .ghost{background:transparent}
  button[disabled]{opacity:.55;cursor:not-allowed}
  button:focus-visible,a:focus-visible{outline:2px solid var(--data);outline-offset:2px}

  nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;
      background:var(--panel);border-top:1px solid var(--line);display:flex}
  nav button{border:0;border-radius:0;min-height:56px;font-size:12px;
             font-family:var(--mono);color:var(--ink2);background:transparent;flex:1;padding:8px 4px}
  nav button[aria-current="true"]{color:var(--ink);font-weight:700;
             box-shadow:inset 0 2px 0 var(--strong)}

  .privacy{border-left:3px solid var(--teal);background:var(--field);
           border-radius:0 10px 10px 0;padding:13px 15px;margin:14px 0}
  .privacy b{display:block;margin-bottom:6px;font-size:14px;color:var(--ink)}
  .privacy ul{margin:6px 0 0;padding-left:18px}
  .privacy li{font-size:13px;color:var(--ink2);margin-bottom:4px}
  .blocked{border-left-color:var(--coral)}

  .acts{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 16px}
  .acts button,.acts .btn{width:auto;flex:1 1 46%}
  .acts .btn{color:var(--ink)}
  .acts .followup{flex:1 1 100%}
  .clinic{display:flex;gap:12px;align-items:flex-start}
  .clinic .meta{flex:1}
  .clinic .name{font-weight:600;font-size:15px}
  .pill{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;
        background:var(--band);color:var(--ink2);white-space:nowrap}
  .in{background:rgba(0,122,135,.12);color:var(--data)}

  /* Profile picking. A list of full-width targets with nothing preselected —
     see the capture flow comment for why that matters. */
  .who-list button{text-align:left;margin-bottom:8px;display:flex;
                   align-items:center;gap:12px;width:100%}
  .who-list .nm{font-weight:600}
  .who-list .rl{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-left:auto}
  .subject{background:var(--strong);color:var(--onStrong);border-radius:12px;
           padding:14px 16px;margin-bottom:12px}
  .subject .lab{font-family:var(--mono);font-size:11px;opacity:.75}
  .subject .nm{font-size:24px;font-weight:800;letter-spacing:-.01em}

  .hist{display:flex;align-items:flex-end;gap:8px;height:96px;margin:4px 0 10px}
  .hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
             align-items:center;gap:6px;height:100%}
  .hist{height:auto}
  .hist .chip{width:100%;text-align:center;color:#fff;border-radius:8px;
              padding:10px 4px;font-family:var(--mono);font-size:11px}
  .hist .col.now .chip{outline:2px solid var(--strong);outline-offset:2px}
  .hist .d{font-family:var(--mono);font-size:10px;color:var(--ink2)}

  .srow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow .t{flex:1}
  .srow .t b{font-size:14px;font-weight:600;display:block}
  .toggle{width:auto;min-width:76px;flex:0 0 auto;font-family:var(--mono);font-size:12px}

  .cam{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;
       background:#0B1120;margin-bottom:12px}
  .cam video,.cam canvas{width:100%;height:100%;object-fit:cover;display:block}
  .cam .guide{position:absolute;inset:12% 8%;border:2px dashed rgba(255,255,255,.55);
              border-radius:10px;pointer-events:none}
  .cam .dot{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;
            font-family:var(--mono);font-size:10px;color:#fff;background:rgba(0,0,0,.45);
            padding:4px 8px;border-radius:999px}
  .cam .dot i{width:7px;height:7px;border-radius:999px;background:#FF5A5A;display:block}
  .local{border-left:3px solid var(--data);background:var(--field);border-radius:0 10px 10px 0;
         padding:11px 14px;margin:0 0 12px;font-size:13px;color:var(--ink2)}
  .local b{color:var(--ink);display:block;margin-bottom:3px;font-size:13.5px}
  .frame{aspect-ratio:4/3;border:2px dashed var(--line);border-radius:12px;
         display:flex;align-items:center;justify-content:center;color:var(--ink2);
         font-family:var(--mono);font-size:12.5px;text-align:center;padding:16px;margin-bottom:12px}
  footer{padding:14px 20px 20px;border-top:1px solid var(--line);font-family:var(--mono);
         font-size:11px;color:var(--ink2);text-align:center}
</style>

<div class="phone">
  <header>
    <span class="logo">ICLO</span>
    <span class="muted" style="font-size:12px">My oral wellness</span>
    <span class="who" id="who"></span>
    <button id="gear" class="gearbtn" type="button" aria-label="Settings and consent">⚙</button>
  </header>
  <div class="synth">DEMO · Synthetic data — illustrative only</div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <footer>Wellness signals only · not medical advice · results stay out of employer views</footer>
</div>

<script>
// ─────────────────────────────────────────────────────────────
// The model follows tech doc §4, which separates three things the obvious
// design merges: the person, the login, and who a login may act for.
//
//   credential ──N:M── profile_access ──N:M── party
//
// Neither the credential nor the party carries an employer. A person can be
// covered by two employers at once (spouses carrying each other), and folding
// the employer into the person splits their record in half.
//
// Faked because it does not exist: the Core AI call behind a score, the payer
// gateway behind a balance, the network directory, booking, and any backend at
// all. contracts status.does_not_exist is the list.
// ─────────────────────────────────────────────────────────────
// ── data boundary ───────────────────────────────────────────
// Everything member-specific comes from data/member-demo.json and nowhere else.
// Until 2026-08-16 the account, plan, coverage, clinics and consent flags were
// inline constants right here, which made "the same screen shows that person's
// own data once real data arrives" false — swapping data meant editing the
// screen. Now the JSON shape IS the contract a backend has to satisfy.
//
// There is no baked-in fallback on purpose. A fallback would let the demo keep
// working while reading nothing, which is the exact failure this repo has hit
// three times: "found nothing" rendered as "nothing wrong". If the fetch fails
// the screen says so and stops.
let DATA = null, ACCOUNT = null, PARTIES = [], SAMPLE = null, POLICY = null;

async function loadData(){
  const r = await fetch("data/member-demo.json", {cache:"no-store"});
  if (!r.ok) throw new Error(`member-demo.json: HTTP ${r.status}`);
  const d = await r.json();
  if (d.schema_version !== 1) throw new Error(`schema_version ${d.schema_version}, expected 1`);
  if (!Array.isArray(d.parties) || !d.parties.length) throw new Error("no parties in member-demo.json");
  DATA = d; ACCOUNT = d.account; PARTIES = d.parties; SAMPLE = d.sample;
  POLICY = d.policy_version;
}

// ── consent ─────────────────────────────────────────────────
// Consent is a list of records, not three booleans, and it is evaluated when a
// purpose is about to be exercised rather than read off a flag set at signup.
// Three things a boolean cannot express, all of which occur in the fixture:
//
//   · agreed, but to a policy text we have since replaced  → needs re-consent
//   · agreed and later withdrew                            → both events kept
//   · never asked                                          → not the same as no
//
// The last record for a purpose wins. Nothing is deleted: the question
// "what were we allowed to do on the day we processed this?" has to stay
// answerable after a withdrawal, and an erasing model cannot answer it.
const PURPOSES = [
  ["processing", "Data processing"],
  ["photo",      "Photo capture and analysis"],
  ["claims",     "Claims linking"],
];

function consentRecord(p, purpose){
  const rs = (p.consent || []).filter(r => r.purpose === purpose);
  return rs.length ? rs[rs.length - 1] : null;
}

// ACTIVE · WITHDRAWN · STALE (granted under superseded policy) · NEVER
function consentState(p, purpose){
  const r = consentRecord(p, purpose);
  if (!r) return "NEVER";
  if (!r.granted) return "WITHDRAWN";
  return r.policy_version === POLICY ? "ACTIVE" : "STALE";
}
const consentOk = (p, purpose) => consentState(p, purpose) === "ACTIVE";

// The gate a capture has to pass. Both purposes, evaluated now — withdrawing
// processing has to stop a capture even though the photo switch is still on,
// because processing is the basis the photo purpose rests on.
const mayCapture = p => consentOk(p, "processing") && consentOk(p, "photo");

const CONSENT_COPY = {
  ACTIVE:    "On",
  WITHDRAWN: "Withdrawn",
  STALE:     "Needs re-consent",
  NEVER:     "Not given",
};

function recordConsent(p, purpose, granted){
  (p.consent = p.consent || []).push({
    purpose, granted, policy_version: POLICY, at: new Date().toISOString(),
  });
}

const BAND = s => s >= 80 ? "Low" : s >= 68 ? "Moderate" : "Priority";

// The underlying figure is computed — bands and direction need it — and never
// rendered. An image-derived number presented to a person as their oral status
// reads outside the general-wellness boundary, so it stays internal until FDA
// clearance. contracts surfaces.employee_app.numeric_score holds the condition.
// A scale position with the numerals removed is the same number in disguise and
// is not an escape from this.
function direction(prev, now){
  const step = 3;                       // below this, call it steady rather than movement
  if (now - prev >= step)  return "Better than your last check-in";
  if (prev - now >= step)  return "Some ground lost since your last check-in";
  return "About the same as your last check-in";
}
const ADVICE = {
  Low:"Keep the current routine.",
  Moderate:"A guided check-in is worth booking when convenient.",
  Priority:"Booking a general dental consult is suggested.",
};
const CLS = {Low:"b-low", Moderate:"b-mod", Priority:"b-pri"};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const party = id => PARTIES.find(p => p.id === id);
const managed = () => PARTIES.filter(p => p.access);
const latest = p => p.history.length ? p.history[p.history.length-1] : null;
// The remaining annual maximum is deliberately NOT shown. The design doc calls
// this the single most important constraint of the benefits feature and says it
// is not a negotiable item: a balance computed from our own claim warehouse is
// wrong whenever a recent visit has not been filed yet — median 45 days, long
// tail 180 — and it is wrong in the direction that sends someone to a chair
// expecting coverage they no longer have. The correct source is a live X12
// 270/271 eligibility+benefits inquiry, which does not exist yet. Until it does,
// the field stays empty and links out. A blank beats a confident wrong number.
// (output/proposal-v10/06_Tech/ICLO-Evidence-Layer-DB-설계-KO.md, "먼저: 잔여
// 한도를 우리 청구 창고에서 계산하면 안 됩니다")
const balanceCard = () => `
  <div class="card">
    <div class="rowlab"><span>Annual maximum remaining</span><span class="v muted">not shown</span></div>
    <div class="muted">We only see claims your dentist has already filed, and those run weeks
      behind. A balance from that would be wrong often enough to matter, so we do not print one.</div>
    <a class="tpalink" href="${esc(ACCOUNT.tpaPortal)}" target="_blank" rel="noopener noreferrer">Check
      your balance with ${esc(ACCOUNT.tpa)} &rarr;</a>
  </div>`;

const TABS = [["home","Home"],["capture","Capture"],["coverage","Coverage"],["care","Find care"]];

// `subject` is the profile a capture is for. It starts null on every entry to
// the flow and is cleared on the way out — never remembered, never defaulted to
// whoever went last. §4.5 names auto-selecting the previous profile as the most
// common way a photo lands on the wrong person, and that error is invisible
// downstream: the aggregate looks fine while the claims link points elsewhere.
let S = { tab:"home", step:0, subject:null };

function privacyBlock(){
  return `<div class="privacy">
    <b>Your employer cannot see this</b>
    <ul>
      <li>Not the photos, the scores, or the visits — none of it reaches ${esc(ACCOUNT.employer)}.</li>
      <li>They see counts across the whole workforce, and any group under 20 people is withheld entirely.</li>
      <li>Photos stay in separate controlled storage, not alongside the aggregate data.</li>
      <li>Consent is per person and per purpose — <button data-go="settings" style="width:auto;min-height:0;padding:0;border:0;background:none;color:var(--data);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer">manage it here</button>.</li>
    </ul>
  </div>`;
}

function scoreCard(p){
  const l = latest(p);
  if (!l) return `<div class="card">
    <div class="muted">${esc(p.name)}</div>
    <p style="margin:8px 0 0">No check-in yet.</p></div>`;
  const b = BAND(l.score);
  const prev = p.history.length > 1 ? p.history[p.history.length-2].score : null;
  return `<div class="card">
    <div class="muted">${esc(p.name)} · ${esc(l.on)}</div>
    <div class="bandhero ${CLS[b]}">${esc(b)}</div>
    ${prev === null ? "" : `<div class="delta">${esc(direction(prev, l.score))}</div>`}
    <p style="margin-top:12px">${esc(ADVICE[b])}</p>
    <p class="muted" style="margin:0">A wellness signal from a guided photo. Not a clinical finding
    and not medical advice. Only a dentist can say what is happening in a mouth.</p>
  </div>`;
}

function historyStrip(p){
  if (p.history.length < 2) return "";
  // Bands over time, not bars over a scale. Heights carried the hidden number
  // back onto the screen — a taller bar is a higher score read off a picture.
  return `<div class="card"><div class="hist">${p.history.map((x,i)=>{
    const b = BAND(x.score);
    return `<div class="col${i===p.history.length-1?" now":""}">
      <div class="chip ${CLS[b]}">${esc(b)}</div>
      <span class="d">${esc(x.on.slice(2))}</span>
    </div>`;}).join("")}</div>
    <div class="muted">Your last ${p.history.length} check-ins. The direction is the part worth reading.</div>
  </div>`;
}

const VIEWS = {
  home(){
    const me = party("P1");
    const others = managed().filter(p => p.id !== "P1");
    const adults = PARTIES.filter(p => !p.access && !p.minor);
    return `<h1>Hi, ${esc(me.name.split(" ")[0])}</h1>
      <p>${esc(ACCOUNT.plan)} · ${esc(ACCOUNT.employer)}</p>
      ${scoreCard(me)}
      ${historyStrip(me)}

      <h2>People you manage</h2>
      ${others.map(p=>{
        const l = latest(p);
        return `<div class="card">
          <div class="rowlab">
            <span><b>${esc(p.name)}</b> <span class="muted">${esc(p.rel)}</span></span>
            <span class="pill">${esc(p.access)}</span>
          </div>
          ${l ? `<div class="rowlab" style="margin-top:8px">
                   <span class="muted">Latest ${esc(l.on)}</span>
                   <span class="bandtag ${CLS[BAND(l.score)]}">${esc(BAND(l.score))}</span></div>`
              : `<div class="muted" style="margin-top:8px">${mayCapture(p)
                   ? "No check-in yet."
                   : "Photo analysis is not active for this profile — no check-ins are taken."}</div>`}
        </div>`;}).join("")}

      ${adults.map(p=>`
        <div class="privacy blocked">
          <b>${esc(p.name)} consents on their own device</b>
          <ul>
            <li>Adult family cannot be added to your account, and you cannot agree on their behalf.</li>
            <li>An invite went out ${esc(p.invited)}. They sign in with their own login and verify by
                one-time code before anything is processed.</li>
            <li>Until then they stay covered by the plan and simply have no app activity.</li>
          </ul>
        </div>`).join("")}

      ${privacyBlock()}
      <h2>Your plan right now</h2>
      ${balanceCard()}
      <button class="primary" data-go="capture">Start a check-in</button>`;
  },

  capture(){
    // Step 0 is the profile choice and cannot be skipped. Nothing is
    // preselected — not even the account holder, who is the obvious default
    // and exactly the wrong one on a shared phone.
    if (S.step === 0){
      // Evaluated here, at the moment the purpose is about to be exercised —
      // not read off a flag decided at signup. A profile whose consent was
      // granted under a superseded policy text is blocked the same as one that
      // withdrew: we are not allowed to keep processing under text the person
      // never saw.
      const eligible = managed().filter(mayCapture);
      const blocked  = managed().filter(p => !mayCapture(p));
      return `<h1>Who is this check-in for?</h1>
        <p>Pick every time. This is not remembered between check-ins — on a shared phone,
        carrying the last choice forward is how a photo ends up on the wrong person.</p>
        <div class="who-list">
          ${eligible.map(p=>`<button data-subject="${esc(p.id)}">
              <span class="nm">${esc(p.name)}</span>
              <span class="rl">${esc(p.rel)} · ${esc(p.access)}</span>
            </button>`).join("")}
        </div>
        ${blocked.map(p=>`
          <div class="privacy blocked">
            <b>${esc(p.name)} is not available</b>
            <ul><li>${!consentOk(p, "processing")
                      ? `Data processing consent is ${CONSENT_COPY[consentState(p, "processing")].toLowerCase()},
                         so nothing is processed for this profile.`
                      : `Photo capture and analysis is ${CONSENT_COPY[consentState(p, "photo")].toLowerCase()}
                         for this profile.`}
                    Settle it in settings before taking a check-in.</li></ul>
          </div>`).join("")}`;
    }

    const p = party(S.subject);
    // Defence 3: the subject's name is the largest thing on every capture step,
    // so a wrong pick is visible while it can still be undone.
    const subject = `<div class="subject">
      <div class="lab">CHECK-IN FOR</div>
      <div class="nm">${esc(p.name)}</div>
    </div>`;

    if (S.step === 1) return `${subject}
      <h1>Upper arch</h1>
      <div class="cam">
        <video id="cam" playsinline muted autoplay></video>
        <div class="guide"></div>
        <div class="dot"><i></i>LIVE · this device</div>
      </div>
      ${localNotice()}
      <p>Fill the guide with the upper teeth and hold still.</p>
      <button class="primary" data-shoot>Capture</button>
      <button class="ghost" data-step="0" style="margin-top:8px">Not ${esc(p.name)} — go back</button>`;

    if (S.step === 2) return `${subject}
      <h1>Your photo</h1>
      <div class="cam"><canvas id="shot"></canvas><div class="guide"></div></div>
      ${localNotice()}
      <div id="quality" class="card"><div class="muted">Checking on this device…</div></div>
      <button class="primary" data-step="3">Continue</button>
      <button class="ghost" data-step="1" style="margin-top:8px">Retake</button>`;

    // The photo is not analysed — there is nothing to analyse it with, and a
    // band invented about a real person's real mouth would be a claim about
    // them. The flow is shown end to end; the result belongs to the sample
    // member and says so.
    const sample = SAMPLE;
    return `${subject}
      <h1>What happens next</h1>
      <div class="local">
        <b>Your photo was not analysed</b>
        It stayed on this device and is gone now. The step that reads a photo is
        an ICLO service call that this demo does not make, so there is no result
        for ${esc(p.name)} and nothing has been stored.
      </div>
      <h2>A result looks like this</h2>
      <p class="muted">Someone else entirely — synthetic, and nothing to do with ${esc(p.name)}.</p>
      ${scoreCard(sample)}
      <div class="card">
        <div class="rowlab"><span class="muted">Would be recorded as taken by</span>
          <span class="v">${esc(ACCOUNT.credential)}</span></div>
        <div class="muted" style="margin-top:6px">Kept separately from whose check-in it is.
        One login taking five people's photos in three minutes is a family checkup day, or a
        mistake — keeping both makes the difference readable later.</div>
      </div>
      ${privacyBlock()}
      <button class="primary" data-go="care">Find a dentist in the network</button>
      <button class="ghost" data-go="home" style="margin-top:8px">Done</button>`;
  },

  coverage(){
    const rows = ACCOUNT.coverage.map(c=>`
      <div class="card">
        <div class="rowlab"><span>${esc(c.k)}</span><span class="v">${c.pct}%</span></div>
        <div class="track"><div class="fill" style="width:${c.pct}%;background:var(--barMid)"></div></div>
        <div class="muted">${esc(c.note)}</div>
      </div>`).join("");
    return `<h1>What the plan covers</h1>
      <p>${esc(ACCOUNT.plan)} · plan year ${esc(ACCOUNT.planYear)}</p>
      ${balanceCard()}
      ${rows}
      <p class="muted">Coverage percentages come from the plan document. The plan document is the
      authority, not this screen.</p>`;
  },

  care(){
    const cost = c => c.est === 0
      ? "<b>$0</b> — preventive is covered in full"
      : "needs the plan's negotiated rate, which we do not have yet";
    const rows = ACCOUNT.clinics.map((c,i)=>`
      <div class="card clinic">
        <div class="meta">
          <div class="name">${esc(c.name)}</div>
          <div class="muted">${c.mi} mi away</div>
          <div class="muted">Your cost: ${cost(c)}</div>
        </div>
        <span class="pill in">In network</span>
      </div>
      <div class="acts" data-clinic="${i}">
        <a class="btn" href="tel:${esc(c.phone.replace(/[^0-9+]/g,""))}"
           data-call="${i}" style="text-align:center;text-decoration:none;display:block">Call ${esc(c.phone)}</a>
        ${c.online
          ? `<a class="btn" href="https://example.invalid/book" target="_blank" rel="noopener"
               data-site="${i}" style="text-align:center;text-decoration:none;display:block">Book on their site ↗</a>`
          : `<span class="muted" style="display:block;padding:6px 2px 0">Phone only — this practice does not take web bookings</span>`}
      </div>`).join("");
    return `<h1>Dentists in the network</h1>
      <p>In network for ${esc(ACCOUNT.plan)}. We do not hold their calendar, so booking happens with
      the practice — by phone, or on their own site where they have one.</p>
      ${rows}
      <p class="muted">Going out of network is your choice; the estimate just changes. Telling us once
      you are booked is what turns the reminders off for that item — you can also switch them off
      entirely in settings. The booking links here point nowhere in this demo; a real build carries
      each practice's own URL from the network directory.</p>`;
  },

  settings(){
    const blocks = managed().map(p=>`
      <h2>${esc(p.name)} <span class="muted">${esc(p.rel)} · consented as ${esc(p.access)}</span></h2>
      <div class="card" style="padding:4px 16px">
        ${PURPOSES.map(([k,label])=>{
          const st = consentState(p, k);
          const when = consentRecord(p, k);
          return `<div class="srow">
            <div class="t"><b>${esc(label)}</b>
              <span class="muted">${esc(CONSENT_COPY[st])}${when ? ` · ${esc(when.at.slice(0,10))}` : ""}${
                st === "STALE" ? ` · agreed to policy ${esc(when.policy_version)}, now ${esc(POLICY)}` : ""}</span></div>
            <button class="toggle" data-consent="${esc(p.id)}:${k}">${
              st === "ACTIVE" ? "Withdraw" : st === "STALE" ? "Agree to the current policy" : "Agree"}</button>
          </div>`;}).join("")}
      </div>`).join("");

    const adults = PARTIES.filter(x => !x.access && !x.minor).map(p=>`
      <h2>${esc(p.name)} <span class="muted">${esc(p.rel)}</span></h2>
      <div class="privacy blocked">
        <b>Not yours to change</b>
        <ul>
          <li>An adult family member holds their own consent. There is no control here for you, and
              that is the design rather than a missing feature.</li>
          <li>Invited ${esc(p.invited)} — they verify by one-time code on their own device.</li>
        </ul>
      </div>`).join("");

    return `<h1>Consent and settings</h1>
      <p>Consent is per person and per purpose. Withdrawing one leaves the others alone.</p>
      ${blocks}
      ${adults}
      <div class="privacy">
        <b>What withdrawing does</b>
        <ul>
          <li>Processing for that purpose stops going forward. It is checked at the moment we are
              about to do the thing, not once at signup.</li>
          <li>The record of your earlier agreement is kept rather than erased. Without it we could
              not answer what we were permitted to do on the day something was processed — and that
              question is the one an auditor asks first.</li>
          <li>If we replace the consent text, agreement to the old text stops counting and shows
              here as needing re-consent. We do not carry it forward silently.</li>
          <li>Figures already published to the employer are aggregate and do not identify anyone, and
              whether past aggregates get rebuilt is <b>still being decided</b> — we will not claim
              either way here.</li>
          <li>Photo retention and deletion follow a written schedule — photos for two years, the
              derived signal longer, this consent record forever. Deleting a photo means destroying
              the key it was encrypted under, so every copy and backup becomes unreadable at once
              rather than one at a time.</li>
          <li>That schedule is decided and <b>not yet operating</b>: there is no photo storage yet,
              so nothing here is enforcing it.</li>
        </ul>
      </div>
      <p class="muted">Consent records in this demo live in the page and reset on reload — a real
      build writes them to the consent table and evaluates them server-side. The evaluation rules
      above are the real ones; only the storage is stubbed.</p>`;
  },
};

// ── Camera ───────────────────────────────────────────────────────────────
// The stream lives here, outside render(), because render() rebuilds the DOM
// and a fresh <video> each time. Two rules this code exists to keep:
//   the frame never leaves the page, and the camera is released the moment the
//   flow is left. A light that stays on after someone navigates away is its own
//   kind of broken promise.
let stream = null;
let shot = null;                       // ImageData, held only until the step changes

// DEMO-ONLY BEHAVIOUR — do not carry this copy into a real build.
//
// Keeping the frame in the page is a property of this demo, not of the product.
// The product uploads it: §2.1 puts oral images in controlled US object storage
// and passes an image_uri to the Core AI call (§8.2). That path needs photo
// consent, a retention schedule, and a deletion route, none of which exist yet
// — which is exactly why the demo does not take it.
//
// The wording says "in this demo" for that reason. Unqualified, it would be a
// promise the shipped product breaks on its first capture.
function localNotice(){
  return `<div class="local">
    <b>In this demo, the photo stays on your phone</b>
    Nothing is uploaded and nothing is stored — leave this screen and it is gone.
    The real service does send it to ICLO to be read, with your consent and under
    a retention schedule.
  </div>`;
}

function stopCamera(){
  if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

async function startCamera(){
  const v = $("cam");
  if (!v) return;
  try {
    if (!stream){
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1280 } }, audio: false });
    }
    v.srcObject = stream;
  } catch (err) {
    // Denied, absent, or blocked. Say which and keep the flow walkable — the
    // point of the demo is the shape of the journey, not the hardware.
    v.closest(".cam").outerHTML =
      `<div class="frame">no camera here — ${esc(err && err.name || "unavailable")}
       <br><span class="muted">the rest of the flow still works</span></div>`;
  }
}

function capture(){
  const v = $("cam");
  if (!v || !v.videoWidth) { S.step = 2; shot = null; return render(); }
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  shot = c;
  stopCamera();                         // release as soon as the frame is taken
  S.step = 2;
  render();
}

// A real quality gate runs in the ICLO service. This is a stand-in that is at
// least honest: it measures the frame on this device and says so. Too dark is
// the failure a guided capture actually hits, and it is cheap to detect.
function checkQuality(){
  const box = $("quality"), cv = $("shot");
  if (!box) return;
  if (!shot || !cv){
    box.innerHTML = `<div class="muted">No frame captured — the flow continues anyway.</div>`;
    return;
  }
  cv.width = shot.width; cv.height = shot.height;
  cv.getContext("2d").drawImage(shot, 0, 0);
  const d = cv.getContext("2d").getImageData(0, 0, cv.width, cv.height).data;
  let sum = 0;
  for (let i = 0; i < d.length; i += 4 * 97)      // sample, not every pixel
    sum += (d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114);
  const lum = sum / (d.length / (4 * 97));
  const dark = lum < 55;
  box.innerHTML = `
    <div class="rowlab"><span>Brightness</span>
      <span class="v">${dark ? "too dark" : "ok"}</span></div>
    <div class="muted" style="margin-top:6px">Measured here on the device — a stand-in for the
    real quality gate, which runs in the ICLO service and checks framing and focus too.
    ${dark ? "Try again somewhere brighter; daylight beats a bathroom light." : ""}</div>`;
}

function paintNav(){
  $("nav").innerHTML = TABS.map(([k,l])=>
    `<button data-go="${k}" aria-current="${k===S.tab}">${l}</button>`).join("");
  $("gear").setAttribute("aria-current", S.tab === "settings");
}
function render(){
  $("who").textContent = ACCOUNT.employer;
  $("view").innerHTML = VIEWS[S.tab]();
  paintNav();
  window.scrollTo(0,0);
  // Anything that is not the live step releases the camera. Cheaper to make
  // this unconditional than to reason about which transitions need it.
  if (!(S.tab === "capture" && S.step === 1)) stopCamera();
  if (S.tab === "capture" && S.step === 1) startCamera();
  if (S.tab === "capture" && S.step === 2) checkQuality();
  if (!(S.tab === "capture" && S.step === 2)) shot = null;
}

document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if (go){
    S.tab = go.dataset.go; S.step = 0;
    // Defence 4: leaving the flow releases the profile. There is no state where
    // the app holds a subject while showing something else.
    S.subject = null;
    return render();
  }
  if (e.target.closest("#gear")){ S.tab="settings"; S.step=0; S.subject=null; return render(); }

  const sub = e.target.closest("[data-subject]");
  if (sub){ S.subject = sub.dataset.subject; S.step = 1; return render(); }

  if (e.target.closest("[data-shoot]")) return capture();

  const st = e.target.closest("[data-step]");
  if (st){
    S.step = +st.dataset.step;
    if (S.step === 0) S.subject = null;      // going back re-asks rather than reusing
    return render();
  }

  const cs = e.target.closest("[data-consent]");
  if (cs){
    const [pid, k] = cs.dataset.consent.split(":");
    const p = party(pid);
    // Append, never overwrite. Re-agreeing after a policy change writes a new
    // record carrying the current policy version, which is what moves it from
    // STALE to ACTIVE — the old record stays as evidence of what was agreed
    // when. Withdrawing appends a granted:false record for the same reason.
    recordConsent(p, k, !consentOk(p, k));
    // Either gate closing drops the profile mid-flow rather than leaving a
    // capture running against a consent that was just withdrawn.
    if ((k === "photo" || k === "processing") && !mayCapture(p) && S.subject === pid) S.subject = null;
    return render();
  }

  const act = e.target.closest("[data-call],[data-site]");
  if (act){
    const box = act.closest(".acts");
    if (!box.querySelector(".followup")){
      box.insertAdjacentHTML("beforeend",
        `<div class="followup">
           <div class="muted" style="padding:8px 2px 6px">Once you have a time, tell us — it stops the reminders.</div>
           <button data-booked>I booked it</button>
         </div>`);
    }
    return;
  }
  const done = e.target.closest("[data-booked]");
  if (done){
    done.outerHTML = `<div class="muted" style="padding:6px 2px">
      Noted — we will confirm it against the claims when they arrive.</div>`;
  }
});

// Boot. The screen renders only after the data is in hand — there is no
// half-loaded state to reason about, and a failure is loud. Opening this file
// over file:// will land here: fetch is blocked by CORS on a file URL, which is
// the honest cost of having a data boundary at all.
loadData().then(render).catch(err => {
  document.getElementById("view").innerHTML =
    `<h1>No member data</h1>
     <div class="privacy blocked">
       <b>${esc(err.message)}</b>
       <ul>
         <li>This screen reads <code>data/member-demo.json</code> and has no built-in copy
             of it. A fallback would let the app render while reading nothing, which is
             exactly the failure mode this project keeps hitting.</li>
         <li>Over <code>file://</code> the browser blocks that read. Run
             <code>scripts/serve.sh</code> and open the served address instead.</li>
       </ul>
     </div>`;
});
</script>
