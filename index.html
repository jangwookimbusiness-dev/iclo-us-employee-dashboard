<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICLO · HomeDen Employer Analytics — Sample</title>
<style>
  :root{
    --coral:#FF7A79; --teal:#007A87;
    --ground:#FFFFFF; --panel:#FFFFFF; --field:#F7F8FA; --line:#E3E8F0;
    --ink:#1B2A4A; --ink2:#5B6B85; --band:#EDF1F7;
    --barLow:#D9E1EE; --barMid:#8FB8BE;
    --strong:#1B2A4A; --onStrong:#FFFFFF; --data:#007A87;
    --shadow:0 1px 2px rgba(27,42,74,.06);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0E1526; --panel:#152038; --field:#0F1930; --line:#28324C;
      --ink:#E7ECF5; --ink2:#95A2BE; --band:#182541;
      --barLow:#2B3956; --barMid:#3E7A82; --strong:#C9D4EA; --onStrong:#0E1526;
      --data:#3FB6C0; --coral:#FF8E8D; --shadow:0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="light"]{
    --ground:#FFFFFF; --panel:#FFFFFF; --field:#F7F8FA; --line:#E3E8F0;
    --ink:#1B2A4A; --ink2:#5B6B85; --band:#EDF1F7; --barLow:#D9E1EE; --barMid:#8FB8BE;
    --strong:#1B2A4A; --onStrong:#FFFFFF; --data:#007A87; --coral:#FF7A79; --shadow:0 1px 2px rgba(27,42,74,.06);
  }
  :root[data-theme="dark"]{
    --ground:#0E1526; --panel:#152038; --field:#0F1930; --line:#28324C;
    --ink:#E7ECF5; --ink2:#95A2BE; --band:#182541; --barLow:#2B3956; --barMid:#3E7A82;
    --strong:#C9D4EA; --onStrong:#0E1526; --data:#3FB6C0; --coral:#FF8E8D; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  .wrap{max-width:none;margin:0 auto;padding:0 28px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  h1,h2{margin:0;text-wrap:balance}
  a{color:var(--data)}
  /* header */
  header{border-bottom:1px solid var(--line);background:var(--panel)}
  /* padding-block, not the shorthand: `padding:14px 0` reset .wrap's 28px side
     padding, so right-aligned text ran into the viewport edge and clipped. */
  .hrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding-block:14px}
  .logo{font-size:20px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:13px}
  .demo-pill{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--coral);
    border:1px solid var(--coral);border-radius:3px;padding:3px 8px}
  .themebtn{font-family:var(--mono);font-size:11px;color:var(--ink2);background:none;
    border:1px solid var(--line);border-radius:3px;padding:3px 8px;cursor:pointer}
  /* tabs */
  nav.tabs{border-bottom:1px solid var(--line);background:var(--panel)}
  .tabrow{display:flex;gap:18px;overflow-x:auto}
  .tab{appearance:none;background:none;border:none;cursor:pointer;font-size:14px;
    color:var(--ink2);padding:11px 0;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--sans)}
  .tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--strong)}
  .tab:focus-visible{outline:2px solid var(--data);outline-offset:2px}
  /* context bar */
  .ctx{background:var(--field);border-bottom:1px solid var(--line)}
  .ctxrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-block:10px}
  select,.seg button,.togglebtn{font-family:var(--mono);font-size:12px;color:var(--ink);
    background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 8px;cursor:pointer}
  select{max-width:100%}
  .seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
  .seg button{border:none;border-radius:0}
  .seg button[aria-pressed="true"],.togglebtn[aria-pressed="true"]{background:var(--strong);color:var(--onStrong)}
  .freshness{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  main{padding:22px 0 8px}
  /* cards */
  .grid{display:grid;gap:12px}
  .g5{grid-template-columns:repeat(2,1fr)}
  @media(min-width:760px){.g5{grid-template-columns:repeat(5,1fr)}}
  .g4{grid-template-columns:1fr}
  @media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
  .card{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:13px;box-shadow:var(--shadow)}
  .card .lab{font-size:12px;color:var(--ink2)}
  .card .val{font-family:var(--mono);font-size:24px;color:var(--ink);margin-top:4px;line-height:1.15}
  .card .val .u{font-size:13px;color:var(--ink2);margin-left:4px}
  .denom{font-size:12px;color:var(--ink2);margin-top:2px;display:inline-block;border-bottom:2px solid transparent}
  .denom.hot{color:var(--data);border-bottom-color:var(--data)}
  .chip{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--data);
    border:1px solid var(--data);border-radius:3px;padding:2px 6px;line-height:1.3}
  .supp{border:1px solid var(--line);background:var(--field);border-radius:3px;padding:8px 10px}
  .supp .t{font-family:var(--mono);font-size:13px;color:var(--ink2)}
  .supp .d{font-size:12px;color:var(--ink2);margin-top:2px}
  .lead{font-size:12.5px;color:var(--ink2);max-width:62ch;margin:14px 0 0}
  .lead b{color:var(--ink)}
  h2.vt{font-size:19px;font-weight:600;margin-bottom:2px}
  .vsub{font-size:12.5px;color:var(--ink2);margin:4px 0 16px;max-width:66ch}
  .vsub.mono{font-family:var(--mono)}
  .col2{display:grid;gap:24px}
  @media(min-width:820px){.col2{grid-template-columns:1fr 1fr}}
  .narrow{max-width:820px}
  /* bar rows */
  .bar{margin-bottom:14px}
  .bar .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .bar .bl{font-size:14px;color:var(--ink)}
  .bar .bv{font-family:var(--mono);font-size:13px;color:var(--ink)}
  .track{height:12px;border-radius:3px;background:var(--field);margin-top:5px;overflow:hidden}
  .fill{height:12px;border-radius:3px}
  .bar .note{font-size:12px;color:var(--ink2);margin-top:4px}
  /* charts */
  .chart{width:100%;height:auto;display:block}
  .legend{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .swatch{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:5px}
  .tip{position:fixed;pointer-events:none;z-index:20;background:var(--strong);color:var(--onStrong);
    font-family:var(--mono);font-size:11px;padding:5px 8px;border-radius:4px;opacity:0;transition:opacity .08s;white-space:nowrap}
  /* data & snowflake */
  .box{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:12px}
  .box h3{margin:0;font-size:12px;font-weight:600;color:var(--ink)}
  .box ul{margin:6px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .box li{font-size:12px;color:var(--ink2);line-height:1.4}
  .flow{display:flex;flex-direction:column;gap:10px;margin-top:18px}
  @media(min-width:860px){.flow{flex-direction:row;align-items:stretch}}
  .flow .srcs{display:flex;flex-direction:column;gap:8px;flex:0 0 22%}
  .flow .srcs .s{border:1px solid var(--line);border-radius:4px;background:var(--panel);padding:8px 10px;font-size:12px}
  .flow .arrow{display:none;align-items:center;color:var(--ink2);font-size:20px}
  @media(min-width:860px){.flow .arrow{display:flex}}
  .flow .plane{flex:1;border:1.5px solid var(--strong);border-radius:5px;padding:13px;background:var(--panel)}
  .plane .ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
  .plane .ph .t{font-size:14px;font-weight:600}
  .plane .grid2{display:grid;gap:8px;grid-template-columns:1fr;margin-top:10px}
  @media(min-width:560px){.plane .grid2{grid-template-columns:1fr 1fr}}
  .flow .outs{display:flex;flex-direction:column;gap:8px;flex:0 0 24%}
  .out{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;background:var(--panel)}
  .out.hot{border-color:var(--data)}
  .out b{color:var(--ink)}
  .notes{display:grid;gap:12px;margin-top:16px;grid-template-columns:1fr}
  @media(min-width:760px){.notes{grid-template-columns:1fr 1fr}}
  .notes .n{border:1px solid var(--line);border-radius:4px;padding:12px;font-size:12px;color:var(--ink2);line-height:1.5}
  .notes .n b{color:var(--ink)}
  /* footer */
  footer{border-top:1px solid var(--line);background:var(--panel)}
  .frow{display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:14px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  .frow .r{margin-left:auto;color:var(--coral)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap hrow">
  <span class="logo">ICLO</span>
  <span class="sub">HomeDen Employer Analytics</span>
  <span class="demo-pill">DEMO · Synthetic data — illustrative only</span>
  <button class="themebtn" id="themebtn" type="button" aria-label="Toggle theme">◐ Theme</button>
</div></header>

<nav class="tabs"><div class="wrap"><div class="tabrow" id="tabrow" role="tablist"></div></div></nav>

<div class="ctx"><div class="wrap ctxrow">
  <select id="scen" aria-label="Employer scenario"></select>
  <select id="dept" aria-label="Department or site filter"></select>
  <div class="seg" role="group" aria-label="Denominator lens">
    <button id="lensE" type="button" aria-pressed="true">Employees lens</button>
    <button id="lensM" type="button" aria-pressed="false">Members lens</button>
  </div>
  <button class="togglebtn" id="srcbtn" type="button" aria-pressed="true">Data sources: on</button>
  <span class="freshness" id="freshness"></span>
</div></div>

<main><div class="wrap" id="view"></div></main>

<footer><div class="wrap frow">
  <span>Aggregate only</span><span id="mincell"></span><span>no individual PHI</span>
  <span class="r">Synthetic data — illustrative only</span>
</div></footer>

<div class="tip" id="tip"></div>

<script>
"use strict";
const C = {
  navy:"var(--strong)", coral:"var(--coral)", teal:"var(--data)",
  ink2:"var(--ink2)", line:"var(--line)", band:"var(--band)",
  barLow:"var(--barLow)", barMid:"var(--barMid)"
};
const SCEN = {
  A:{label:"Employer A · 10,000 (baseline)", employees:10000, pmpm:31.4},
  B:{label:"Employer B · 2,500 (small)", employees:2500, pmpm:32.8},
  C:{label:"Employer C · 25,000 (large)", employees:25000, pmpm:30.9},
};
// ---- single source of truth ----------------------------------------------
// Every number on screen derives from this block. Nothing below re-states a
// value that lives here; change it here and the whole dashboard follows.
// test_single_source.py fails if any of these stops propagating.
const MIN_CELL = 20;                 // employer-view minimum cell size
const DEP_RATIO = 2.2;               // covered members per eligible employee
const FRAC = {activated:0.38, repeat:0.61, valid:0.28, gap:0.095, closed:0.042};
const FRESH = {                      // data currency, shown in the context bar
  eligibilityThru:"2026-07",
  claimsThru:"2026-05",
  lagDays:60,
  completenessPct:98.4,
};
const pct = f => Math.round(f*100)+"%";
const SIGNALS = [
  {key:"Low", share:52, color:"var(--barLow)", note:"keep current routine"},
  {key:"Moderate", share:33, color:"var(--barMid)", note:"guided self-care + benefit navigation"},
  {key:"Priority", share:15, color:"var(--coral)", note:"general dental consult suggested — not a clinical finding"},
];
const SRC = {
  eligible:{chip:"HRIS · 834 eligibility", via:"SFTP monthly → staged load"},
  members:{chip:"HRIS · 834 dependents", via:"SFTP monthly → staged load"},
  app:{chip:"App · consent + events", via:"API event stream"},
  gap:{chip:"App events + TPA claims-confirmed", via:"API + 837D/835"},
  claims:{chip:"TPA · 837D/835 allowed", via:"SFTP / Secure Data Sharing"},
  preventive:{chip:"TPA · CDT D1000-series", via:"837D/835"},
  signal:{chip:"App · photo-derived signals (versioned)", via:"derived features only"},
};
const DEPTS = (emp, scen) => {
  const tiny = {A:14,B:8,C:16}[scen];
  return [
    {key:"All departments", n:emp},
    {key:"Operations", n:Math.round(emp*0.42)},
    {key:"Sales", n:Math.round(emp*0.26)},
    {key:"Engineering", n:Math.round(emp*0.19)},
    {key:"Finance", n:Math.round(emp*0.08)},
    {key:"Facilities (pilot site)", n:tiny},
  ];
};
// "Trend vs control" is deliberately absent from v1. It needs a control arm,
// and experiment assignment has no consent basis, allocation rule or protocol
// owner agreed yet. The tab returns when that is settled — not before.
const TABS = [["overview","Overview"],["signals","Signals"],["funnel","Funnel"],
  ["data","Data & Snowflake"]];
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let S = {scen:"A", tab:"overview", dept:"All departments", lens:"employees", showSrc:true};

// ---- atoms ----
function chip(s){ return S.showSrc ? `<span class="chip" title="Ingestion: ${esc(s.via)}">${esc(s.chip)}</span>` : ""; }
const cellSupp = n => n < MIN_CELL;
// Group size is the denominator and is already on screen, so naming it costs
// nothing. A suppressed cell value must NOT be echoed here — printing it would
// hand back exactly what the rule withholds.
function suppressed(n, revealN){
  const d = revealN
    ? `Group size ${n} is below the minimum cell size of ${MIN_CELL}. Values are withheld by policy.`
    : `This cell falls below the minimum cell size of ${MIN_CELL}. The value is withheld by policy.`;
  return `<div class="supp"><div class="t">Suppressed (n&lt;${MIN_CELL})</div><div class="d">${d}</div></div>`;
}
function card({lab,val,unit,denom,src,hot,supp,n,revealN}){
  const body = supp
    ? `<div style="margin-top:4px">${suppressed(n,revealN)}</div>`
    : `<div class="val">${val}${unit?`<span class="u">${unit}</span>`:""}</div>
       <div class="denom${hot?" hot":""}">${denom}</div>`;
  return `<div class="card"><div class="lab">${lab}</div>${body}${supp?"":(src?chip(src):"")}</div>`;
}
function barRow({label,pct,count,color,note,src,supp,n,revealN}){
  const head = `<div class="top"><span class="bl">${label}</span>${supp?"":`<span class="bv">${pct}% · ${fmt(count)}</span>`}</div>`;
  if(supp) return `<div class="bar">${head}${suppressed(n,revealN)}</div>`;
  return `<div class="bar">${head}
    <div class="track"><div class="fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="note">${note}</div>${label==="Priority"?chip(src):""}</div>`;
}
function box(title, items){
  return `<div class="box"><h3>${title}</h3><ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
}

// ---- line chart (Trend / guardrail) ----
// ---- render ----
function render(){
  const sc = SCEN[S.scen];
  const depts = DEPTS(sc.employees, S.scen);
  const D = depts.find(d=>d.key===S.dept) || depts[0];
  const scale = D.n / sc.employees;
  const supp = D.n < 20;
  const employees = D.n;
  const members = Math.round(employees*DEP_RATIO);
  const valid = Math.round(sc.employees*FRAC.valid*scale);
  const hotE = S.lens==="employees", hotM = S.lens==="members";
  const v = document.getElementById("view");
  let html = "";

  if(S.tab==="overview"){
    // Each rate stands on its own underlying count, so each is tested on its own.
    // A percentage over a small group identifies people just as well as the count.
    const nActivated = Math.round(employees*FRAC.activated);
    const nRepeat = Math.round(nActivated*FRAC.repeat);
    const cards = [
      card({lab:"Eligible employees", val:fmt(employees), denom:"funnel denominator", src:SRC.eligible, hot:hotE}),
      card({lab:"Covered members", val:fmt(members), unit:"est. ×"+DEP_RATIO, denom:"cost denominator (member-months)", src:SRC.members, hot:hotM}),
      card({lab:"Activated", val:pct(FRAC.activated), denom:"of eligible employees", src:SRC.app, hot:hotE, supp:supp||cellSupp(nActivated), n:D.n, revealN:supp}),
      card({lab:"Repeat participation", val:pct(FRAC.repeat), denom:"of activated", src:SRC.app, supp:supp||cellSupp(nRepeat), n:D.n, revealN:supp}),
      card({lab:"Dental PMPM (allowed)", val:"$"+sc.pmpm.toFixed(2), denom:"per covered member-month", src:SRC.claims, hot:hotM, supp:supp||cellSupp(members), n:D.n, revealN:supp}),
    ].join("");
    html = `<div class="grid g5">${cards}</div>
      <p class="lead">Denominator discipline: participation uses <b>eligible employees</b> — staff at
      contracted employers who are plan-eligible in the period, per HRIS 834. That is the population,
      not the app users; the app users are the <b>Activated</b> share of it. Cost uses
      <b>covered member-months</b> (employees + enrolled dependents, counted per month). The two are
      never mixed — the lens above highlights which one each figure stands on.</p>`;
  }

  if(S.tab==="signals"){
    const rows = SIGNALS.map(s=>{
      const count = Math.round(valid*s.share/100);
      return barRow({label:s.key, pct:s.share, count, color:s.color, note:s.note, src:SRC.signal,
        supp:supp||cellSupp(count), n:D.n, revealN:supp});
    }).join("");
    html = `<div class="narrow"><h2 class="vt">Oral-health signal distribution</h2>
      <p class="vsub">Non-specific wellness signals derived from guided photos and questionnaires.
      Aggregate only — no individual results exist anywhere in this product for employers.</p>
      ${rows}
      <p class="vsub" style="margin-top:8px">Counts are of valid captures. Any consult is employee-initiated
      (opt-in) — the product never routes anyone to care automatically.</p></div>`;
  }

  if(S.tab==="funnel"){
    const funnel = [
      {label:"Eligible employees", v:employees, src:SRC.eligible},
      {label:"Activated (registered + first questionnaire)", v:Math.round(sc.employees*FRAC.activated*scale), src:SRC.app},
      {label:"Valid capture (passed photo-quality gate)", v:valid, src:SRC.app},
      {label:"Open care actions", v:Math.round(sc.employees*FRAC.gap*scale), src:SRC.gap},
      {label:"Completed actions", v:Math.round(sc.employees*FRAC.closed*scale), src:SRC.gap},
    ];
    const rows = supp ? suppressed(D.n, true) : funnel.map((f,i)=>{
      const col = i===0?C.barLow:i<3?C.barMid:C.teal;
      const head = `<div class="top"><span class="bl">${f.label}</span>${cellSupp(f.v)?"":`<span class="bv">${fmt(f.v)}</span>`}</div>`;
      if(cellSupp(f.v)) return `<div class="bar">${head}${suppressed(f.v)}</div>`;
      return `<div class="bar">${head}
        <div class="track"><div class="fill" style="width:${(f.v/employees)*100}%;background:${col}"></div></div>
        ${chip(f.src)}</div>`;
    }).join("");
    html = `<div class="narrow"><h2 class="vt">Intervention funnel</h2>
      <p class="vsub mono">denominator: eligible employees</p>${rows}
      <p class="vsub" style="margin-top:8px">"Completed" splits into self-reported vs claims-confirmed in the
      pilot analysis plan; only claims-confirmed completion counts toward outcome claims.</p></div>`;
  }

  if(S.tab==="data"){
    html = `<h2 class="vt">Where each number comes from</h2>
      <p class="vsub">Four source systems, one governed model. Every metric in this demo carries its source chip
      (toggle in the bar above). Access to dental claims is a contract matter — a data-rights clause in the
      employer–TPA agreement is the hard filter for customer selection.</p>
      <div class="grid g4">
        ${box("Employee app",["Consent, questionnaire, photo metadata, participation events","Ingestion: API event stream","Feeds: Activated · Valid capture · Signals · Care actions"])}
        ${box("Employer HRIS",["Eligibility (834), benefit design","Ingestion: SFTP monthly → staged load","Feeds: Eligible employees (funnel denom) · Covered member-months (cost denom)"])}
        ${box("Dental TPA / ASO",["837D / 835 or agreed claims extract — CDT, service dates, allowed · paid · OOP","Ingestion: SFTP or Secure Data Sharing where supported","Feeds: PMPM · Preventive-visit rate · Claims-confirmed completion"])}
        ${box("Clinical partner",["Employee-requested consult outcomes, referrals, completion","Ingestion: API","Feeds: Completed actions (confirmed)"])}
      </div>
      <div class="flow">
        <div class="srcs">${["Employee app","Employer HRIS","Dental TPA / ASO","Clinical partner"].map(s=>`<div class="s">${s}</div>`).join("")}</div>
        <div class="arrow">→</div>
        <div class="plane">
          <div class="ph"><span class="t">Snowflake governed health data plane</span>
            <span class="chip" style="margin-top:0">US region · Business Critical · signed BAA</span></div>
          <div class="grid2">
            ${box("PHI boundary",["Raw intraoral photos never enter Snowflake — controlled object storage / PHI vault","Snowflake holds secure URIs, metadata, derived signals only"])}
            ${box("Unified model",["member-month · CDT · intervention · outcome","single definition set across employer, TPA, app"])}
            ${box("Governance",["RBAC · row access · masking · access history",`n ≥ ${MIN_CELL} cell suppression (as demoed live)`])}
            ${box("Collaboration",["Secure Data Sharing · Clean Rooms","no cross-org raw copies"])}
          </div>
        </div>
        <div class="arrow">→</div>
        <div class="outs">
          <div class="out hot"><b>Employer aggregate</b> — this demo. No individual PHI, ever.</div>
          <div class="out"><b>ICLO care operations</b> — minimum-necessary only</div>
          <div class="out"><b>Employee &amp; dentist</b> — own results · consult on request</div>
        </div>
      </div>
      <div class="notes">
        <div class="n">Edition and a signed BAA are necessary, not sufficient. HIPAA operation is completed by
          configuration and controls — RBAC, masking, access history, suppression, retention, incident response.</div>
        <div class="n"><b>Open items (Snowflake Korea):</b> contracting entity before US incorporation [TBD] ·
          KR program credits usable on a US-region account [TBD] · BAA execution process.</div>
      </div>`;
  }

  v.innerHTML = html;
  bindTips();
}

// tabs
const tabrow = document.getElementById("tabrow");
document.getElementById("freshness").textContent =
  `eligibility ${FRESH.eligibilityThru} · claims thru ${FRESH.claimsThru} (${FRESH.lagDays}-day lag) · completeness ${FRESH.completenessPct}% (synthetic)`;
document.getElementById("mincell").textContent = `cell size n ≥ ${MIN_CELL}`;

tabrow.innerHTML = TABS.map(([k,l])=>`<button class="tab" role="tab" data-k="${k}"
  aria-selected="${k===S.tab}">${l}</button>`).join("");
tabrow.addEventListener("click",e=>{const b=e.target.closest(".tab"); if(!b)return;
  S.tab=b.dataset.k; [...tabrow.children].forEach(x=>x.setAttribute("aria-selected", x.dataset.k===S.tab)); render();});

// scenario + dept
const scenSel = document.getElementById("scen");
scenSel.innerHTML = Object.entries(SCEN).map(([k,s])=>`<option value="${k}">${s.label}</option>`).join("");
function fillDepts(){
  const depts = DEPTS(SCEN[S.scen].employees, S.scen);
  document.getElementById("dept").innerHTML = depts.map(d=>`<option value="${d.key}">${d.key} · ${fmt(d.n)}</option>`).join("");
}
scenSel.addEventListener("change",e=>{S.scen=e.target.value; S.dept="All departments"; fillDepts(); render();});
document.getElementById("dept").addEventListener("change",e=>{S.dept=e.target.value; render();});

// lens + source
const lensE=document.getElementById("lensE"), lensM=document.getElementById("lensM");
lensE.addEventListener("click",()=>{S.lens="employees"; lensE.setAttribute("aria-pressed","true"); lensM.setAttribute("aria-pressed","false"); render();});
lensM.addEventListener("click",()=>{S.lens="members"; lensM.setAttribute("aria-pressed","true"); lensE.setAttribute("aria-pressed","false"); render();});
const srcbtn=document.getElementById("srcbtn");
srcbtn.addEventListener("click",()=>{S.showSrc=!S.showSrc; srcbtn.setAttribute("aria-pressed",S.showSrc);
  srcbtn.textContent="Data sources: "+(S.showSrc?"on":"off"); render();});

// theme
const themebtn=document.getElementById("themebtn");
themebtn.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark"); render();});

// tooltips
const tip=document.getElementById("tip");
function bindTips(){
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.addEventListener("mousemove",e=>{tip.textContent=el.getAttribute("data-tip");
      tip.style.opacity="1"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px";});
    el.addEventListener("mouseleave",()=>{tip.style.opacity="0";});
  });
}

fillDepts(); render();
</script>
</body>
</html>
