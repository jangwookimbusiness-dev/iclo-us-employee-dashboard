     location.replace runs first and leaves no history entry, which matters
     because the visitor arrived from a printed QR code and pressing Back must
     not drop them onto this stub again. The meta refresh covers no-JS. -->

<meta http-equiv="refresh" content="0; url=https://grin-mauve.vercel.app/">

</style>
</head>
