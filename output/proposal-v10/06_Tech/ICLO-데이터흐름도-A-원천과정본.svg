<text x="62.0" y="804.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.52" fill="#5a6b7d" font-weight="400" text-anchor="start">원본 이미지는 ICLO가 직접 운영하는 미국 리전 저장소에 있고, Snowflake로 들어오는 것은 참조·촬영 시각·모델 버전·밴드뿐입니다.</text>
<circle cx="45" cy="826" r="8" fill="#17202b"/>
<text x="45.0" y="830.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.0" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="62.0" y="830.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14.56" fill="#17202b" font-weight="700" text-anchor="start">SPD는 피드가 아닙니다.</text>
<text x="62.0" y="848.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.52" fill="#5a6b7d" font-weight="400" text-anchor="start">급여 설계는 어떤 전자 문서로도 오지 않습니다. 사람이 플랜 문서에서 옮겨 적고 2인 검증합니다 — 그래서 원천 카드 중 유일하게 색이 다릅니다.</text>
