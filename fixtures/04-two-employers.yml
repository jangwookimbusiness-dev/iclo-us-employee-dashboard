name: 한 사람이 두 기업에 동시 소속. 청구는 한쪽 것이다
guards: [claims_pm 에 employer_id 포함]
why: |
  기술문서 1278 — 사람·월로만 접으면 기업 A 의 청구가 기업 B 화면에 더해진다.
  **행 접근 정책은 이 경로를 막지 못한다.** 정책은 member_month 쪽만 거르기 때문이다.
input:
  eligibility_spans:
    - {party: P1, employer: A, from: 2026-01-01, to: 2026-01-31}
    - {party: P1, employer: B, from: 2026-01-01, to: 2026-01-31}
  claims:
    - {party: P1, employer: A, service_date: 2026-01-09, allowed: 60}
expected:
  rows:
    - {employer: A, month: 2026-01, member_months: 1.0, allowed: 60, dental_pmpm: 60.0}
    - {employer: B, month: 2026-01, member_months: 1.0, allowed: 0,  dental_pmpm: 0.0}
  working: 두 기업 각각 31/31 = 1.0. 청구 60 은 A 에만 귀속
  failure_mode:
    if: claims_pm 을 (party, month) 로만 접으면
    value: B 도 dental_pmpm 60.0
